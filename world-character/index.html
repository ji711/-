<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캐릭터와 떠나는 세계여행</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
button{font-family:inherit;cursor:pointer}

/* =========================
   나라 선택
========================= */
#home{
  width:100%;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;
  background:linear-gradient(145deg,#dff6ff,#fff8df,#f8e8ff);
}
#home h1{
  font-size:clamp(32px,5vw,68px);
  color:#30364a;text-align:center;margin-bottom:8px;
}
.subtitle{
  font-size:clamp(17px,2vw,25px);
  color:#697084;margin-bottom:28px;
}
.countryGrid{
  width:min(1100px,94vw);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.countryBtn{
  border:0;background:rgba(255,255,255,.94);
  border-radius:25px;padding:18px 10px;
  box-shadow:0 8px 25px rgba(0,0,0,.1);
  font-size:clamp(18px,2.4vw,29px);
  font-weight:900;color:#333;
  transition:.2s;
}
.countryBtn:hover{transform:translateY(-4px) scale(1.02)}
.flag{
  display:block;
  font-size:clamp(36px,5vw,62px);
  margin-bottom:4px;
}

/* =========================
   여행 화면
========================= */
#world{
  display:none;position:relative;
  width:100vw;height:100vh;overflow:hidden;
  background:linear-gradient(#bcecff,#e9faff 65%,#c8ecb6);
}
#background{
  position:absolute;inset:0;z-index:1;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
#shade{
  position:absolute;inset:0;z-index:2;
  pointer-events:none;
  background:linear-gradient(
    180deg,rgba(0,0,0,.08),
    transparent 28%,transparent 75%,
    rgba(0,0,0,.08)
  );
}
#effects{
  position:absolute;inset:0;z-index:5;
  pointer-events:none;overflow:hidden;
}

/* =========================
   나라별 효과
========================= */
.petal{
  position:absolute;top:-60px;
  animation:petalFall linear infinite;
}
@keyframes petalFall{
  0%{transform:translate(0,-10vh) rotate(0);opacity:0}
  10%{opacity:.95}
  100%{transform:translate(130px,115vh) rotate(500deg);opacity:.3}
}

.cloud{
  position:absolute;left:-250px;opacity:.68;
  animation:cloudMove linear infinite;
}
@keyframes cloudMove{
  to{transform:translateX(calc(100vw + 500px))}
}

.rain{
  position:absolute;top:-80px;
  width:3px;height:60px;
  background:rgba(225,242,255,.78);
  border-radius:10px;transform:rotate(12deg);
  animation:rainFall linear infinite;
}
@keyframes rainFall{
  to{transform:translate(80px,120vh) rotate(12deg)}
}

.sparkle{
  position:absolute;
  animation:sparkle 1.8s ease-in-out infinite;
}
@keyframes sparkle{
  0%,100%{opacity:.15;transform:scale(.5)}
  50%{opacity:1;transform:scale(1.45)}
}

.leaf{
  position:absolute;top:-60px;
  animation:leafFall linear infinite;
}
@keyframes leafFall{
  0%{transform:translate(0,-10vh) rotate(0)}
  50%{transform:translate(100px,50vh) rotate(180deg)}
  100%{transform:translate(-50px,115vh) rotate(450deg)}
}

.waterLight{
  position:absolute;left:-20%;bottom:-10%;
  width:140%;height:40%;
  background:repeating-radial-gradient(
    ellipse at center,
    rgba(255,255,255,.18) 0 3px,
    transparent 4px 22px
  );
  animation:waterMove 5s ease-in-out infinite alternate;
}
@keyframes waterMove{
  from{transform:translateX(-20px) scaleY(.9)}
  to{transform:translateX(30px) scaleY(1.08)}
}

.sunRay{
  position:absolute;left:-20%;top:-40%;
  width:80%;height:150%;
  background:linear-gradient(
    120deg,rgba(255,245,180,.32),transparent 55%
  );
  animation:sunGlow 4s ease-in-out infinite alternate;
}
@keyframes sunGlow{
  from{opacity:.3}to{opacity:.9}
}

.sand{
  position:absolute;width:5px;height:5px;
  border-radius:50%;
  background:rgba(235,203,135,.8);
  animation:sandMove linear infinite;
}
@keyframes sandMove{
  from{transform:translateX(-20vw)}
  to{transform:translateX(120vw) translateY(-70px)}
}
.heat{
  position:absolute;inset:0;
  backdrop-filter:blur(.35px);
  animation:heatWave 2s ease-in-out infinite alternate;
}
@keyframes heatWave{
  from{transform:scale(1)}
  to{transform:scale(1.006) translateY(-2px)}
}

/* =========================
   위쪽 UI
========================= */
#countryInfo{
  position:absolute;z-index:30;
  top:22px;left:22px;
  padding:14px 22px;
  border-radius:24px;
  background:rgba(255,255,255,.91);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.13);
}
#countryName{
  font-size:clamp(23px,3vw,40px);
  font-weight:900;color:#30364a;
}
#countryMessage{
  margin-top:3px;font-size:15px;color:#666;
}
#controls{
  position:absolute;z-index:40;
  top:22px;right:22px;
  display:flex;gap:9px;
}
.controlBtn{
  border:0;padding:13px 17px;
  border-radius:18px;
  background:rgba(255,255,255,.94);
  box-shadow:0 6px 18px rgba(0,0,0,.13);
  font-size:15px;font-weight:900;
}

/* ==================================================
   캐릭터 무대
================================================== */
#stage{
  position:absolute;inset:0;z-index:18;
  pointer-events:none;overflow:hidden;
}

.character{
  position:absolute;
  width:clamp(130px,15vw,230px);
  height:clamp(170px,21vw,310px);
  transform-origin:center bottom;
  transition:left 4s ease-in-out,top 4s ease-in-out;
}

/*
  puppet 안에 동일한 누끼 이미지를 여러 장 겹친다.
  clip-path로 팔/다리/몸 부분만 보이게 함.
*/
.puppet{
  position:absolute;
  inset:0;
  transform-origin:center bottom;
  filter:drop-shadow(0 11px 7px rgba(0,0,0,.23));
}

.part{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}

/* 몸통은 중앙 부분 */
.bodyPart{
  clip-path:polygon(
    27% 15%,
    73% 15%,
    74% 76%,
    26% 76%
  );
  z-index:4;
}

/* 머리 */
.headPart{
  clip-path:polygon(
    20% 0%,
    80% 0%,
    78% 35%,
    22% 35%
  );
  z-index:6;
  transform-origin:50% 28%;
}

/* 왼팔 */
.leftArm{
  clip-path:polygon(
    0% 25%,
    42% 23%,
    45% 72%,
    0% 72%
  );
  z-index:3;
  transform-origin:36% 32%;
}

/* 오른팔 */
.rightArm{
  clip-path:polygon(
    58% 23%,
    100% 25%,
    100% 72%,
    55% 72%
  );
  z-index:5;
  transform-origin:64% 32%;
}

/* 왼다리 */
.leftLeg{
  clip-path:polygon(
    18% 60%,
    52% 60%,
    52% 100%,
    15% 100%
  );
  z-index:2;
  transform-origin:45% 66%;
}

/* 오른다리 */
.rightLeg{
  clip-path:polygon(
    48% 60%,
    82% 60%,
    85% 100%,
    48% 100%
  );
  z-index:1;
  transform-origin:55% 66%;
}

/* 가운데 빈 부분이 생기는 것을 막는 기본 이미지 */
.basePart{
  z-index:0;
  opacity:.95;
}

/* =========================
   걷기
========================= */
.character.walking .puppet{
  animation:bodyWalk .42s ease-in-out infinite alternate;
}
.character.walking .leftArm{
  animation:leftArmWalk .45s ease-in-out infinite alternate;
}
.character.walking .rightArm{
  animation:rightArmWalk .45s ease-in-out infinite alternate-reverse;
}
.character.walking .leftLeg{
  animation:leftLegWalk .45s ease-in-out infinite alternate-reverse;
}
.character.walking .rightLeg{
  animation:rightLegWalk .45s ease-in-out infinite alternate;
}
.character.walking .headPart{
  animation:headWalk .45s ease-in-out infinite alternate;
}

@keyframes bodyWalk{
  from{transform:translateY(0) rotate(-1deg)}
  to{transform:translateY(-7px) rotate(1deg)}
}
@keyframes leftArmWalk{
  from{transform:rotate(-11deg)}
  to{transform:rotate(12deg)}
}
@keyframes rightArmWalk{
  from{transform:rotate(-11deg)}
  to{transform:rotate(12deg)}
}
@keyframes leftLegWalk{
  from{transform:rotate(-8deg)}
  to{transform:rotate(8deg)}
}
@keyframes rightLegWalk{
  from{transform:rotate(-8deg)}
  to{transform:rotate(8deg)}
}
@keyframes headWalk{
  from{transform:rotate(-1deg) translateY(0)}
  to{transform:rotate(1deg) translateY(-2px)}
}

/* =========================
   빼꼼
========================= */
.character.peek .puppet{
  animation:peekBody .6s ease-in-out infinite alternate;
}
@keyframes peekBody{
  from{transform:rotate(-2deg)}
  to{transform:rotate(5deg)}
}

.character.pop .puppet{
  animation:popIn .7s cubic-bezier(.2,1.4,.5,1);
}
@keyframes popIn{
  0%{transform:scale(.7) translateY(25px)}
  70%{transform:scale(1.08) translateY(-7px)}
  100%{transform:scale(1) translateY(0)}
}

/* =========================
   안녕! 오른팔을 크게 흔듦
========================= */
.character.hello .rightArm{
  z-index:10;
  animation:helloArm .28s ease-in-out 8 alternate;
}
.character.hello .puppet{
  animation:helloBody .55s ease-in-out infinite alternate;
}

@keyframes helloArm{
  from{transform:rotate(-12deg)}
  to{transform:rotate(-52deg)}
}
@keyframes helloBody{
  from{transform:translateY(0)}
  to{transform:translateY(-5px)}
}

/* 말풍선 */
.speech{
  position:absolute;
  z-index:20;
  left:50%;
  top:-28px;
  transform:translateX(-50%) scale(0);
  padding:9px 16px;
  border-radius:22px;
  background:white;
  color:#333;
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.17);
}
.speech::after{
  content:"";
  position:absolute;
  left:50%;bottom:-9px;
  transform:translateX(-50%);
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-top:11px solid white;
}
.character.hello .speech{
  animation:speechHello 2.5s ease;
}
@keyframes speechHello{
  0%,100%{
    opacity:0;
    transform:translateX(-50%) scale(0);
  }
  12%,82%{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
}

/* =========================
   하트
========================= */
.hearts{
  position:absolute;
  z-index:20;
  left:50%;top:0;
  transform:translateX(-50%);
  opacity:0;
  font-size:36px;
  white-space:nowrap;
}
.character.love .hearts{
  animation:heartPop 2.1s ease-out;
}
@keyframes heartPop{
  0%{
    opacity:0;
    transform:translate(-50%,35px) scale(.4)
  }
  20%{
    opacity:1;
    transform:translate(-50%,0) scale(1.15)
  }
  100%{
    opacity:0;
    transform:translate(-50%,-100px) scale(.9)
  }
}

/* 도착 */
#arrival{
  position:absolute;z-index:50;
  left:50%;top:18%;
  transform:translate(-50%,-50%) scale(0);
  padding:17px 28px;
  border-radius:28px;
  background:rgba(255,255,255,.95);
  box-shadow:0 12px 35px rgba(0,0,0,.2);
  font-size:clamp(20px,3vw,35px);
  font-weight:900;
  pointer-events:none;
}
#arrival.show{animation:arrival 1.8s ease}
@keyframes arrival{
  0%{transform:translate(-50%,-50%) scale(0)}
  15%{transform:translate(-50%,-50%) scale(1.08)}
  25%,75%{transform:translate(-50%,-50%) scale(1)}
  100%{transform:translate(-50%,-50%) scale(0)}
}

/* =========================
   QR
========================= */
#qrCard{
  position:absolute;z-index:40;
  right:22px;bottom:22px;
  width:185px;padding:14px;
  border-radius:23px;
  background:rgba(255,255,255,.94);
  box-shadow:0 8px 28px rgba(0,0,0,.18);
  text-align:center;
}
#qrCard h3{font-size:15px;margin-bottom:8px}
#qrcode{
  width:145px;height:145px;margin:auto;
  display:flex;align-items:center;justify-content:center;
}
#qrcode img,#qrcode canvas{
  max-width:145px!important;
  max-height:145px!important;
}
#qrCard p{margin-top:7px;color:#666;font-size:12px}

/* =========================
   배경 선택
========================= */
#backgroundModal{
  display:none;position:fixed;inset:0;z-index:100;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);
}
.modalBox{
  width:min(500px,90vw);
  padding:32px;border-radius:32px;
  background:white;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modalBox .big{font-size:58px}
.modalBox h2{margin:8px 0;font-size:27px}
.modalBox p{
  margin-bottom:20px;color:#777;line-height:1.6;
}
.uploadLabel{
  display:block;padding:17px;
  border-radius:20px;
  background:#525bea;color:white;
  font-size:19px;font-weight:900;cursor:pointer;
}
#bgInput{display:none}
.closeModal{
  margin-top:10px;padding:11px 20px;
  border:0;border-radius:15px;background:#eee;
}

/* =========================
   휴대폰
========================= */
#phone{
  display:none;width:100%;
  min-height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,#e8f8ff,#fff5df);
  padding:22px 17px 50px;
}
.phoneBox{
  width:min(520px,100%);
  margin:auto;padding:25px 19px;
  border-radius:30px;background:white;
  box-shadow:0 10px 35px rgba(0,0,0,.1);
  text-align:center;
}
.phoneTitle{
  font-size:27px;font-weight:900;color:#30364a;
}
#phoneCountry{
  margin:10px 0 20px;
  font-size:17px;font-weight:800;color:#5c6476;
}
#readyText{
  margin-bottom:16px;padding:10px;
  border-radius:15px;background:#f1f8ff;
  font-size:14px;color:#647080;
}
.cameraLabel{
  display:block;width:100%;
  padding:20px;border-radius:22px;
  background:#525bea;color:white;
  font-size:21px;font-weight:900;cursor:pointer;
}
#cameraInput{display:none}
#progressBox{display:none;margin-top:22px}
.progressOuter{
  height:15px;border-radius:20px;
  background:#eee;overflow:hidden;
}
#progressBar{
  width:0;height:100%;
  background:#525bea;transition:.2s;
}
#statusText{
  margin-top:10px;
  font-size:16px;font-weight:800;color:#555;
}
#previewWrap{display:none;margin-top:18px}
#preview{
  width:100%;max-height:330px;
  object-fit:contain;border-radius:20px;
  background:
    linear-gradient(45deg,#eee 25%,transparent 25%),
    linear-gradient(-45deg,#eee 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#eee 75%),
    linear-gradient(-45deg,transparent 75%,#eee 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
#success{
  display:none;margin-top:18px;padding:18px;
  border-radius:20px;background:#e7fff0;
  color:#23844a;font-size:20px;font-weight:900;
}
#retryBtn{
  display:none;width:100%;
  margin-top:12px;padding:16px;
  border:0;border-radius:19px;
  background:#ff8197;color:white;
  font-size:18px;font-weight:900;
}
.tip{
  margin-top:18px;color:#777;
  line-height:1.6;font-size:14px;
}

@media(max-width:700px){
  .countryGrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<!-- 나라 선택 -->
<div id="home">
  <h1>🌎 캐릭터와 떠나는 세계여행 ✈️</h1>
  <div class="subtitle">어디로 여행을 떠나볼까요?</div>

  <div class="countryGrid">
    <button class="countryBtn" onclick="selectCountry('korea')">
      <span class="flag">🇰🇷</span>대한민국
    </button>

    <button class="countryBtn" onclick="selectCountry('japan')">
      <span class="flag">🇯🇵</span>일본
    </button>

    <button class="countryBtn" onclick="selectCountry('china')">
      <span class="flag">🇨🇳</span>중국
    </button>

    <button class="countryBtn" onclick="selectCountry('vietnam')">
      <span class="flag">🇻🇳</span>베트남
    </button>

    <button class="countryBtn" onclick="selectCountry('france')">
      <span class="flag">🇫🇷</span>프랑스
    </button>

    <button class="countryBtn" onclick="selectCountry('uk')">
      <span class="flag">🇬🇧</span>영국
    </button>

    <button class="countryBtn" onclick="selectCountry('usa')">
      <span class="flag">🇺🇸</span>미국
    </button>

    <button class="countryBtn" onclick="selectCountry('brazil')">
      <span class="flag">🇧🇷</span>브라질
    </button>

    <button class="countryBtn" onclick="selectCountry('egypt')">
      <span class="flag">🇪🇬</span>이집트
    </button>
  </div>
</div>

<!-- 전자칠판 -->
<div id="world">
  <div id="background"></div>
  <div id="shade"></div>
  <div id="effects"></div>
  <div id="stage"></div>

  <div id="countryInfo">
    <div id="countryName"></div>
    <div id="countryMessage">캐릭터 친구들이 여행 중이에요 ✈️</div>
  </div>

  <div id="controls">
    <button class="controlBtn" onclick="openBackground()">🖼️ 우리 배경</button>
    <button class="controlBtn" onclick="clearCharacters()">🧹 캐릭터 정리</button>
    <button class="controlBtn" onclick="goHome()">🌎 다른 나라</button>
  </div>

  <div id="qrCard">
    <h3>📱 캐릭터 보내기</h3>
    <div id="qrcode"></div>
    <p>QR을 찍고 그림을 촬영해주세요!</p>
  </div>

  <div id="arrival">👀 빼꼼! 새로운 친구가 왔어요</div>
</div>

<!-- 배경 선택 -->
<div id="backgroundModal">
  <div class="modalBox">
    <div class="big">🖼️</div>
    <h2 id="modalCountry">배경을 골라주세요</h2>

    <p>
      선생님이 만든 배경을 선택해주세요.<br>
      <b>나라에 맞는 움직이는 효과는 자동!</b>
    </p>

    <label class="uploadLabel">
      📷 우리 배경 불러오기
      <input id="bgInput" type="file" accept="image/*">
    </label>

    <button class="closeModal" onclick="closeBackground()">닫기</button>
  </div>
</div>

<!-- 휴대폰 -->
<div id="phone">
  <div class="phoneBox">

    <div class="phoneTitle">🎨 내 캐릭터 여행 보내기</div>

    <div id="phoneCountry">여행지를 확인하고 있어요...</div>

    <div id="readyText">✂️ 누끼 기능 준비 중...</div>

    <label class="cameraLabel">
      📸 캐릭터 촬영하기
      <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
      >
    </label>

    <div id="progressBox">
      <div class="progressOuter">
        <div id="progressBar"></div>
      </div>
      <div id="statusText">준비 중...</div>
    </div>

    <div id="previewWrap">
      <img id="preview">
    </div>

    <div id="success">
      ✈️ 슝~!<br>
      내 캐릭터가 여행을 시작했어요!
    </div>

    <button id="retryBtn">📸 다른 캐릭터 보내기</button>

    <div class="tip">
      💡 <b>흰 종이</b>에 캐릭터를 크게 그리고<br>
      팔다리까지 전체가 잘 보이게 촬영해주세요.
    </div>

  </div>
</div>

<script type="module">

/* ==================================================
   FIREBASE
================================================== */

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  remove,
  get
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={

/* ==================================================
   ROOM
================================================== */

const params=new URLSearchParams(location.search);
const phoneMode=params.get("mode")==="phone";

let room=params.get("room");

if(!phoneMode){
  room=localStorage.getItem("worldTravelRoom");

  if(!room){
    room=Math.random().toString(36).substring(2,8);
    localStorage.setItem("worldTravelRoom",room);
  }
}

/* ==================================================
   요소
================================================== */

const home=document.getElementById("home");
const world=document.getElementById("world");
const background=document.getElementById("background");
const effects=document.getElementById("effects");
const stage=document.getElementById("stage");
const countryName=document.getElementById("countryName");
const arrival=document.getElementById("arrival");

let currentCountry=null;

/* ==================================================
   나라 선택
================================================== */

window.selectCountry=async function(key){

  currentCountry=key;
  const c=COUNTRIES[key];

  home.style.display="none";
  world.style.display="block";

  countryName.textContent=`${c.flag} ${c.name}`;

  background.style.backgroundImage="none";

  createEffects(c.effect);

  await set(
    ref(db,`rooms/${room}/currentCountry`),
    key
  );

  createQR();

  setTimeout(openBackground,300);
};

/* ==================================================
   배경
================================================== */

const backgroundModal=document.getElementById("backgroundModal");
const bgInput=document.getElementById("bgInput");
const modalCountry=document.getElementById("modalCountry");

window.openBackground=function(){

  if(currentCountry){
    const c=COUNTRIES[currentCountry];
    modalCountry.textContent=
      `${c.flag} ${c.name} 배경을 골라주세요`;
  }

  backgroundModal.style.display="flex";
};

window.closeBackground=function(){
  backgroundModal.style.display="none";
};

bgInput.addEventListener("change",function(){

  const file=this.files?.[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{
    background.style.backgroundImage=`url("${e.target.result}")`;
    closeBackground();
  };

  reader.readAsDataURL(file);
});

/* ==================================================
   QR
================================================== */

function createQR(){

  const box=document.getElementById("qrcode");
  box.innerHTML="";

  const url=
    `${location.origin}${location.pathname}?mode=phone&room=${encodeURIComponent(room)}`;

  new QRCode(box,{
    text:url,
    width:145,
    height:145,
    correctLevel:QRCode.CorrectLevel.M
  });
}

/* ==================================================
   나라 효과
================================================== */

      e.style.animationDelay=(-Math.random()*10)+"s";
      effects.appendChild(e);
    }
  }

  if(type==="cloud"){
    for(let i=0;i<5;i++){
      const e=document.createElement("div");
      e.className="cloud";
      e.textContent="☁️";
      e.style.top=(5+Math.random()*40)+"%";
      e.style.fontSize=(60+Math.random()*70)+"px";
      e.style.animationDuration=(25+Math.random()*20)+"s";
      e.style.animationDelay=(-Math.random()*25)+"s";
      effects.appendChild(e);
    }

  if(type==="rain"){
    for(let i=0;i<50;i++){
      const e=document.createElement("div");
      e.className="rain";
      e.style.left=Math.random()*100+"%";
      e.style.animationDuration=(.8+Math.random()*.6)+"s";
      e.style.animationDelay=(-Math.random()*2)+"s";
      effects.appendChild(e);
    }
  }

  if(type==="sparkle"){
    for(let i=0;i<28;i++){
      const e=document.createElement("div");
      e.className="sparkle";
      e.textContent="✨";
      e.style.left=Math.random()*100+"%";
      e.style.top=Math.random()*85+"%";
      e.style.fontSize=(14+Math.random()*22)+"px";
      e.style.animationDelay=Math.random()*2+"s";
      effects.appendChild(e);
    }
  }

  if(type==="water"){
    const e=document.createElement("div");
    e.className="waterLight";
    effects.appendChild(e);
  }

  if(type==="leaf"){
    const sun=document.createElement("div");
    sun.className="sunRay";
    effects.appendChild(sun);

    for(let i=0;i<16;i++){
      const e=document.createElement("div");
      e.className="leaf";
      e.textContent="🍃";
      e.style.left=Math.random()*100+"%";
      e.style.fontSize=(17+Math.random()*18)+"px";
      e.style.animationDuration=(7+Math.random()*8)+"s";

  if(type==="sand"){
    const heat=document.createElement("div");
    heat.className="heat";
    effects.appendChild(heat);

    for(let i=0;i<65;i++){
      const e=document.createElement("div");
      e.className="sand";
      e.style.left=Math.random()*100+"%";
      e.style.top=Math.random()*100+"%";
      e.style.animationDuration=(3+Math.random()*5)+"s";

/* ==================================================
   홈 / 정리
================================================== */

window.goHome=function(){
  world.style.display="none";
  home.style.display="flex";
  currentCountry=null;
  effects.innerHTML="";
  background.style.backgroundImage="none";
};

const shownCharacters=new Set();

window.clearCharacters=async function(){
  stage.innerHTML="";
  shownCharacters.clear();

  try{
    await remove(ref(db,`rooms/${room}/characters`));
  }catch(e){}
};

/* ==================================================
   종이인형 만들기
================================================== */

function makePart(src,className){

  const img=document.createElement("img");

  img.src=src;
  img.className=`part ${className}`;

  return img;
}

function addCharacter(id,image){

  if(shownCharacters.has(id))return;
  shownCharacters.add(id);

  const char=document.createElement("div");
  char.className="character";

  const puppet=document.createElement("div");
  puppet.className="puppet";

  /*
    동일한 누끼를 영역별로 잘라 겹친다.
  */

  puppet.appendChild(makePart(image,"basePart"));
  puppet.appendChild(makePart(image,"leftLeg"));
  puppet.appendChild(makePart(image,"rightLeg"));
  puppet.appendChild(makePart(image,"leftArm"));
  puppet.appendChild(makePart(image,"bodyPart"));
  puppet.appendChild(makePart(image,"rightArm"));
  puppet.appendChild(makePart(image,"headPart"));

  const speech=document.createElement("div");
  speech.className="speech";
  speech.textContent="안녕! 👋";

  const hearts=document.createElement("div");
  hearts.className="hearts";
  hearts.textContent="💗 💕 💗";

  char.appendChild(puppet);
  char.appendChild(speech);
  char.appendChild(hearts);

  stage.appendChild(char);

  /* 왼쪽 / 오른쪽 랜덤 등장 */
  const fromLeft=Math.random()>.5;

  const y=
    window.innerHeight*.42+
    Math.random()*(window.innerHeight*.23);

  char.style.top=y+"px";

  if(fromLeft){
    char.style.left="-180px";
  }else{
    char.style.left=(window.innerWidth+20)+"px";
  }

  char.classList.add("peek");

  arrival.classList.remove("show");
  void arrival.offsetWidth;
  arrival.classList.add("show");

  /* 빼꼼 */
  setTimeout(()=>{
    char.style.left=
      fromLeft
      ? "-70px"
      : (window.innerWidth-95)+"px";
  },150);

  /* 쏙 들어오기 */
  setTimeout(()=>{

    char.classList.remove("peek");
    char.classList.add("pop");

    char.style.left=
      fromLeft
      ? (60+Math.random()*160)+"px"
      : Math.max(
          60,
          window.innerWidth-360-Math.random()*130
        )+"px";

  },1400);

  /* 들어오자마자 안녕 */
  setTimeout(()=>{

    char.classList.remove("pop");
    doHello(char);

  },2400);
}

/* ==================================================
   안녕
================================================== */

function doHello(char){

  if(!char.isConnected)return;

  char.classList.remove("walking","love");
  char.classList.add("hello");

  setTimeout(()=>{

    char.classList.remove("hello");

    moveCharacter(char);

  },2600);
}

/* ==================================================
   이동
================================================== */

function moveCharacter(char){

  if(!char.isConnected)return;

  char.classList.remove("hello","love");
  char.classList.add("walking");

  const width=Math.max(140,char.offsetWidth);
  const height=Math.max(180,char.offsetHeight);

  /*
    QR 영역을 피해서 주로 화면 왼쪽~중앙 이동
  */
  const maxX=Math.max(
    120,
    window.innerWidth-width-220
  );

  const minY=window.innerHeight*.35;

  const maxY=Math.max(
    minY+30,
    window.innerHeight-height-25
  );

  const oldX=char.offsetLeft;

  const x=
    25+
    Math.random()*Math.max(40,maxX-25);

  const y=
    minY+
    Math.random()*Math.max(30,maxY-minY);

  /*
    이동 방향에 따라 인형 전체 좌우 반전.
  */
  const puppet=char.querySelector(".puppet");

  if(x<oldX){
    puppet.style.scale="-1 1";
  }else{
    puppet.style.scale="1 1";
  }

  char.style.left=x+"px";
  char.style.top=y+"px";

  setTimeout(()=>{

    if(!char.isConnected)return;

    char.classList.remove("walking");

    randomAction(char);

  },4100);
}

/* ==================================================
   랜덤 행동
================================================== */

function randomAction(char){

  if(!char.isConnected)return;

  const r=Math.random();

  /*
    안녕을 꽤 자주 함.
  */
  if(r<.48){

    doHello(char);

  }else if(r<.72){

    char.classList.add("love");

    setTimeout(()=>{

      char.classList.remove("love");

      moveCharacter(char);

    },2100);

  }else{

    setTimeout(
      ()=>moveCharacter(char),
      1100
    );
  }
}

/* ==================================================
   Firebase 캐릭터 감시
================================================== */

if(!phoneMode){

  onValue(
    ref(db,`rooms/${room}/characters`),

    snapshot=>{

      const data=snapshot.val();

      if(!data){
        stage.innerHTML="";
        shownCharacters.clear();
        return;
      }

      Object.entries(data).forEach(([id,item])=>{

        if(item?.image){
          addCharacter(id,item.image);
        }

      });
    }
  );
}

/* ==================================================
   휴대폰
================================================== */

if(phoneMode){

  home.style.display="none";
  world.style.display="none";

  document.getElementById("phone").style.display="block";

  const phoneCountry=document.getElementById("phoneCountry");
  const readyText=document.getElementById("readyText");
  const cameraInput=document.getElementById("cameraInput");
  const progressBox=document.getElementById("progressBox");
  const progressBar=document.getElementById("progressBar");
  const statusText=document.getElementById("statusText");
  const previewWrap=document.getElementById("previewWrap");
  const preview=document.getElementById("preview");
  const success=document.getElementById("success");
  const retryBtn=document.getElementById("retryBtn");

  let removeBackground=null;

  /* 나라 */
  onValue(
    ref(db,`rooms/${room}/currentCountry`),

    snapshot=>{

      const key=snapshot.val();

      if(key&&COUNTRIES[key]){

        const c=COUNTRIES[key];

        phoneCountry.textContent=
          `${c.flag} ${c.name}으로 여행을 떠나요! ✈️`;

      }else{

        phoneCountry.textContent=
          "전자칠판에서 나라를 먼저 골라주세요 🌎";
      }
    }
  );

  /* 누끼 라이브러리 미리 로딩 */
  async function preloadRemoval(){

    try{

      readyText.textContent="✂️ 캐릭터 마법가위 준비 중...";

      const module=
        await import(
          "https://esm.sh/@imgly/background-removal@1.7.0"
        );

      removeBackground=
        module.removeBackground||module.default;

      readyText.textContent="✨ 준비 완료! 바로 촬영해주세요.";

    }catch(error){

      console.error(error);

      readyText.textContent=
        "📸 촬영해주세요. 누끼 기능은 촬영 후 준비할게요.";
    }
  }

  preloadRemoval();

  /* ==================================================
     사진을 먼저 줄여서 렉 감소
  ================================================== */

  async function shrinkBeforeRemoval(file){

    const bitmap=await createImageBitmap(file);

    /*
      이전 1000보다 조금 더 작게.
      수업에서는 속도 우선.
    */
    const MAX=850;

    let w=bitmap.width;
    let h=bitmap.height;

    if(w>MAX||h>MAX){

      const ratio=Math.min(MAX/w,MAX/h);

      w=Math.round(w*ratio);
      h=Math.round(h*ratio);
    }

    const canvas=document.createElement("canvas");

    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");

    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,w,h);

    ctx.drawImage(bitmap,0,0,w,h);

    const blob=await new Promise(resolve=>{
      canvas.toBlob(resolve,"image/jpeg",.76);
    });

    bitmap.close?.();

    return blob||file;
  }

  /* ==================================================
     누끼 후 전송용으로 줄이기
  ================================================== */

  async function makeSmallCharacter(blob){

    const bitmap=await createImageBitmap(blob);

    const MAX=450;

    let w=bitmap.width;
    let h=bitmap.height;

    if(w>MAX||h>MAX){

      const ratio=Math.min(MAX/w,MAX/h);

      w=Math.round(w*ratio);
      h=Math.round(h*ratio);
    }

    const canvas=document.createElement("canvas");

    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");

    ctx.clearRect(0,0,w,h);
    ctx.drawImage(bitmap,0,0,w,h);

    bitmap.close?.();

    /*
      투명 WebP
    */
    let result=canvas.toDataURL("image/webp",.75);

    if(!result||!result.startsWith("data:image/")){
      result=canvas.toDataURL("image/png");
    }

    return result;
  }

  /* ==================================================
     촬영 → 누끼 → 자동전송
  ================================================== */

  cameraInput.addEventListener(
    "change",
    async function(){

      const file=this.files?.[0];

      if(!file)return;

      success.style.display="none";
      retryBtn.style.display="none";
      previewWrap.style.display="none";

      progressBox.style.display="block";
      progressBar.style.width="5%";

      statusText.textContent="📸 캐릭터를 준비하고 있어요...";

      try{

        /* 먼저 축소 */
        const smallPhoto=
          await shrinkBeforeRemoval(file);

        progressBar.style.width="20%";

        /* 라이브러리 준비 */
        if(!removeBackground){

          statusText.textContent="✂️ 마법가위 준비 중...";

          const module=
            await import(
              "https://esm.sh/@imgly/background-removal@1.7.0"
            );

          removeBackground=
            module.removeBackground||module.default;
        }

        progressBar.style.width="30%";

        statusText.textContent="✂️ 캐릭터만 쏙 꺼내는 중...";

        /* 누끼 */
        const cutout=
          await removeBackground(
            smallPhoto,
            {
              model:"isnet_quint8",
              device:"cpu",
              proxyToWorker:false,

              output:{
                format:"image/png",
                quality:1
              },

              progress:(key,current,total)=>{

                if(total>0){

                  const p=
                    30+
                    Math.round((current/total)*45);

                  progressBar.style.width=
                    Math.min(75,p)+"%";
                }
              }
            }
          );

        progressBar.style.width="80%";

        statusText.textContent="✨ 여행 준비 중...";

        const finalImage=
          await makeSmallCharacter(cutout);

        preview.src=finalImage;
        previewWrap.style.display="block";

        progressBar.style.width="90%";

        statusText.textContent="✈️ 전자칠판으로 슝~";

        /*
          현재 나라 확인
        */
        const countrySnapshot=
          await get(
            ref(db,`rooms/${room}/currentCountry`)
          );

        const country=
          countrySnapshot.val()||"";

        /*
          새 캐릭터 추가
        */
        const newCharacter=
          push(
            ref(db,`rooms/${room}/characters`)
          );

        await set(
          newCharacter,
          {
            image:finalImage,
            country:country,
            createdAt:Date.now()
          }
        );

        progressBar.style.width="100%";
        statusText.textContent="🎉 도착했어요!";

        success.style.display="block";
        retryBtn.style.display="block";

      }catch(error){

        console.error(error);

        progressBar.style.width="0%";

        statusText.innerHTML=
          "🥹 캐릭터를 꺼내지 못했어요.<br>흰 종이에 팔다리가 잘 보이게 놓고 다시 촬영해주세요.";

        retryBtn.style.display="block";
      }
    }
  );

  /* 다시 촬영 */
  retryBtn.addEventListener("click",()=>{

    cameraInput.value="";

    progressBox.style.display="none";
    previewWrap.style.display="none";
    success.style.display="none";
    retryBtn.style.display="none";

    cameraInput.click();
  });
}

</script>
