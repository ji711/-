<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캐릭터와 떠나는 세계여행</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:#111;
}
button,label{font:inherit}
.hidden{display:none!important}

/* =========================
   전자칠판
========================= */
#board{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
}

#home{
  position:absolute;
  inset:0;
  overflow:auto;
  text-align:center;
  padding:28px 22px 60px;
  background:linear-gradient(#bceaff,#f8fdff);
}

.earth{font-size:75px}

#home h1{
  margin:4px 0 6px;
  font-size:clamp(34px,6vw,72px);
  color:#173852;
}

#home p{
  margin:0 0 22px;
  color:#4f687d;
  font-size:clamp(17px,2.4vw,26px);
}

.grid{
  width:min(1050px,96%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.country{
  min-height:116px;
  border:0;
  border-radius:24px;
  background:white;
  box-shadow:0 7px 20px #0002;
  font-size:21px;
  font-weight:900;
  color:#263b50;
}

.country .flag{
  display:block;
  font-size:48px;
  margin-bottom:3px;
}

@media(max-width:650px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

/* 여행 화면 */
#world{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#000;
}

#photoBg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transform:scale(1.02);
}

#photoBg:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.22),
    transparent 30%,
    transparent 70%,
    rgba(0,0,0,.34)
  );
}

.topCard{
  position:absolute;
  z-index:20;
  left:22px;
  top:20px;
  padding:12px 18px;
  border-radius:23px;
  background:#ffffffeb;
  box-shadow:0 6px 18px #0003;
}

.topCard b{
  display:block;
  font-size:clamp(27px,4vw,45px);
}

.topCard span{
  color:#566;
  font-size:15px;
}

.homeBtn{
  position:absolute;
  z-index:30;
  right:20px;
  top:20px;
  border:0;
  border-radius:25px;
  padding:12px 18px;
  background:#ffffffee;
  font-weight:900;
  box-shadow:0 4px 15px #0003;
}

/* QR */
.qrCard{
  position:absolute;
  z-index:30;
  right:18px;
  bottom:18px;
  width:190px;
  padding:12px;
  border-radius:22px;
  background:#ffffffed;
  box-shadow:0 7px 22px #0004;
  text-align:center;
}

.qrCard b{
  display:block;
  margin-bottom:7px;
}

#qr{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:140px;
}

#qr img,
#qr canvas{
  width:140px!important;
  height:140px!important;
}

.qrCard small{
  display:block;
  margin-top:7px;
  line-height:1.35;
  color:#555;
}

/* 캐릭터 */
#stage{
  position:absolute;
  inset:0;
  z-index:15;
  pointer-events:none;
}

.puppet{
  position:absolute;
  width:clamp(170px,24vw,330px);
  height:clamp(240px,38vw,480px);
  left:-35vw;
  bottom:4vh;
  animation:walkAcross 16s linear forwards;
  filter:drop-shadow(0 12px 8px #0007);
}

.piece{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  will-change:transform;
}

/* 자동 분할 */
.head{
  clip-path:polygon(17% 0,83% 0,83% 39%,17% 39%);
  transform-origin:50% 32%;
  animation:headBob .8s ease-in-out infinite alternate;
}

.body{
  clip-path:polygon(23% 29%,77% 29%,77% 76%,23% 76%);
  transform-origin:50% 64%;
  animation:bodyBob .42s ease-in-out infinite alternate;
}

.armL{
  clip-path:polygon(0 21%,43% 21%,43% 74%,0 74%);
  transform-origin:35% 34%;
  animation:armL .52s ease-in-out infinite alternate;
}

.armR{
  clip-path:polygon(57% 21%,100% 21%,100% 74%,57% 74%);
  transform-origin:65% 34%;
  animation:armR .52s ease-in-out infinite alternate;
}

.legL{
  clip-path:polygon(12% 62%,53% 62%,53% 100%,12% 100%);
  transform-origin:42% 66%;
  animation:legL .52s ease-in-out infinite alternate;
}

.legR{
  clip-path:polygon(47% 62%,88% 62%,88% 100%,47% 100%);
  transform-origin:58% 66%;
  animation:legR .52s ease-in-out infinite alternate;
}

@keyframes walkAcross{
  0%{left:-30vw;bottom:5vh}
  18%{left:7vw;bottom:5vh}
  42%{left:33vw;bottom:10vh}
  68%{left:58vw;bottom:7vh}
  100%{left:110vw;bottom:5vh}
}

@keyframes armL{
  from{transform:rotate(15deg)}
  to{transform:rotate(-18deg)}
}

@keyframes armR{
  from{transform:rotate(-15deg)}
  to{transform:rotate(18deg)}
}

@keyframes legL{
  from{transform:rotate(-9deg) translateY(0)}
  to{transform:rotate(10deg) translateY(3px)}
}

@keyframes legR{
  from{transform:rotate(10deg) translateY(3px)}
  to{transform:rotate(-9deg) translateY(0)}
}

@keyframes headBob{
  from{transform:rotate(-2deg) translateY(0)}
  to{transform:rotate(2deg) translateY(-4px)}
}

@keyframes bodyBob{
  from{transform:translateY(0)}
  to{transform:translateY(-5px)}
}

.arrive{
  position:absolute;
  z-index:40;
  left:50%;
  top:16%;
  transform:translateX(-50%);
  padding:13px 22px;
  border-radius:28px;
  background:#fff;
  box-shadow:0 7px 22px #0004;
  font-size:clamp(20px,3vw,32px);
  font-weight:900;
  opacity:0;
}

.arrive.show{
  animation:notice 2.6s ease;
}

@keyframes notice{
  0%{opacity:0;transform:translate(-50%,-15px)}
  15%,76%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0}
}

/* =========================
   휴대폰
========================= */
#phone{
  width:100vw;
  min-height:100vh;
  overflow:auto;
  padding:20px 16px 50px;
  text-align:center;
  background:linear-gradient(#c9efff,#fff4d8);
}

.card{
  max-width:520px;
  margin:auto;
  padding:24px 18px;
  border-radius:30px;
  background:white;
  box-shadow:0 8px 30px #0002;
}

.card h1{
  margin:4px 0 6px;
  font-size:30px;
}

#phoneCountry{
  margin:8px 0 20px;
  font-weight:900;
  color:#345;
}

.take{
  display:block;
  padding:18px;
  border-radius:24px;
  background:#238cff;
  color:white;
  font-size:21px;
  font-weight:900;
  box-shadow:0 5px 16px #0002;
}

.take input{
  display:none;
}

#previewWrap{
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:20px;
  background:
    repeating-conic-gradient(#eee 0 25%,#fff 0 50%)
    0 / 22px 22px;
}

#preview{
  max-width:100%;
  max-height:390px;
  object-fit:contain;
}

#send{
  width:100%;
  margin-top:16px;
  padding:17px;
  border:0;
  border-radius:24px;
  background:#ffd84f;
  font-size:21px;
  font-weight:900;
}

#send:disabled{
  opacity:.45;
}

#status{
  min-height:50px;
  margin-top:14px;
  color:#445;
  font-weight:800;
  line-height:1.45;
}

.progress{
  display:none;
  height:11px;
  margin-top:10px;
  overflow:hidden;
  border-radius:20px;
  background:#e8edf2;
}

#bar{
  width:0;
  height:100%;
  background:#69aef7;
  transition:width .2s;
}

.tip{
  margin-top:18px;
  padding:12px;
  border-radius:18px;
  background:#f5f8fa;
  color:#5d6871;
  font-size:14px;
  line-height:1.45;
}
</style>
</head>

<body>

<div id="board">

  <section id="home">

    <div class="earth">🌎✈️</div>

    <h1>캐릭터와 떠나는 세계여행</h1>

    <p>
      실제 세계 풍경 속으로<br>
      내가 그린 캐릭터가 여행을 떠나요!
    </p>

    <div class="grid">

      <button class="country" data-country="korea">
        <span class="flag">🇰🇷</span>
        대한민국
      </button>

      <button class="country" data-country="japan">
        <span class="flag">🇯🇵</span>
        일본
      </button>

      <button class="country" data-country="china">
        <span class="flag">🇨🇳</span>
        중국
      </button>

      <button class="country" data-country="vietnam">
        <span class="flag">🇻🇳</span>
        베트남
      </button>

      <button class="country" data-country="france">
        <span class="flag">🇫🇷</span>
        프랑스
      </button>

      <button class="country" data-country="uk">
        <span class="flag">🇬🇧</span>
        영국
      </button>

      <button class="country" data-country="usa">
        <span class="flag">🇺🇸</span>
        미국
      </button>

      <button class="country" data-country="brazil">
        <span class="flag">🇧🇷</span>
        브라질
      </button>

      <button class="country" data-country="egypt">
        <span class="flag">🇪🇬</span>
        이집트
      </button>

    </div>

  </section>


  <section id="world" class="hidden">

    <div id="photoBg"></div>

    <div class="topCard">
      <b id="countryTitle"></b>
      <span>QR을 찍고 캐릭터를 보내보세요 ✨</span>
    </div>

    <button id="homeBtn" class="homeBtn">
      🌎 나라 고르기
    </button>

    <div id="stage"></div>

    <div id="arrive" class="arrive">
      ✨ 캐릭터가 도착했어요!
    </div>

    <div class="qrCard">

      <b>📱 내 캐릭터 띄우기</b>

      <div id="qr"></div>

      <small>
        QR → 사진 촬영 → 자동 누끼<br>
        → 전자칠판에 등장!
      </small>

    </div>

  </section>

</div>


<div id="phone" class="hidden">

  <div class="card">

    <div class="earth">📱🎨</div>

    <h1>내 캐릭터 보내기</h1>

    <div id="phoneCountry">
      전자칠판과 연결 중...
    </div>

    <label class="take">
      📸 그림 사진 찍기
      <input
        id="photoInput"
        type="file"
        accept="image/*"
        capture="environment"
      >
    </label>

    <div class="progress" id="progress">
      <div id="bar"></div>
    </div>

    <div id="status">
      종이 위 캐릭터가 크게 보이게 찍어주세요 😊
    </div>

    <div id="previewWrap">
      <img id="preview">
    </div>

    <button id="send" disabled>
      ✈️ 세계로 보내기
    </button>

    <div class="tip">
      앱 설치·로그인 필요 없음<br>
      사진을 찍으면 자동으로 배경을 없애요.
    </div>

  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  get
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyCBdA2qEuytaJQwGil8Smo1mBtUPrVivAM",
  authDomain: "world-character.firebaseapp.com",
  databaseURL: "https://world-character-default-rtdb.firebaseio.com",
  projectId: "world-character",
  storageBucket: "world-character.firebasestorage.app",
  messagingSenderId: "462004318277",
  appId: "1:462004318277:web:3e7a7237d5bfea6b76332c",
  measurementId: "G-W2E6LTWTCJ"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* =========================
   실제 여행지 사진
========================= */

const COUNTRIES = {

  korea:{
    flag:"🇰🇷",
    name:"대한민국",
    photo:
    "https://images.unsplash.com/photo-1538485399081-7c8970b1c9b1?auto=format&fit=crop&w=1800&q=85"
  },

  japan:{
    flag:"🇯🇵",
    name:"일본",
    photo:
    "https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?auto=format&fit=crop&w=1800&q=85"
  },

  china:{
    flag:"🇨🇳",
    name:"중국",
    photo:
    "https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=1800&q=85"
  },

  vietnam:{
    flag:"🇻🇳",
    name:"베트남",
    photo:
    "https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=1800&q=85"
  },

  france:{
    flag:"🇫🇷",
    name:"프랑스",
    photo:
    "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1800&q=85"
  },

  uk:{
    flag:"🇬🇧",
    name:"영국",
    photo:
    "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1800&q=85"
  },

  usa:{
    flag:"🇺🇸",
    name:"미국",
    photo:
    "https://images.unsplash.com/photo-1485871981521-5b1fd3805eee?auto=format&fit=crop&w=1800&q=85"
  },

  brazil:{
    flag:"🇧🇷",
    name:"브라질",
    photo:
    "https://images.unsplash.com/photo-1483729558449-99ef09a8c325?auto=format&fit=crop&w=1800&q=85"
  },

  egypt:{
    flag:"🇪🇬",
    name:"이집트",
    photo:
    "https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=1800&q=85"
  }

};


/* =========================
   전자칠판/휴대폰 구분
========================= */

const params =
  new URLSearchParams(location.search);

const mode =
  params.get("mode");

const isPhone =
  mode === "phone";


let room =
  params.get("room");


if(!room && !isPhone){

  room =
    localStorage.getItem(
      "worldTravelRoom"
    );

  if(!room){

    room =
      Math.random()
      .toString(36)
      .slice(2,8)
      .toUpperCase();

    localStorage.setItem(
      "worldTravelRoom",
      room
    );

  }

}


room =
  (room || "")
  .replace(
    /[^A-Za-z0-9_-]/g,
    ""
  )
  .slice(0,20);


document
.getElementById("board")
.classList
.toggle("hidden",isPhone);


document
.getElementById("phone")
.classList
.toggle("hidden",!isPhone);


if(isPhone){

  startPhone();

}else{

  startBoard();

}


/* =========================
   전자칠판
========================= */

function startBoard(){

  makeQR();


  document
  .querySelectorAll(".country")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      async ()=>{

        const country =
          btn.dataset.country;

        await set(
          ref(
            db,
            `rooms/${room}/currentCountry`
          ),
          country
        );

        showCountry(country);

      }
    );

  });


  document
  .getElementById("homeBtn")
  .onclick = ()=>{

    document
    .getElementById("world")
    .classList.add("hidden");

    document
    .getElementById("home")
    .classList.remove("hidden");

  };


  let lastStamp = 0;


  onValue(
    ref(
      db,
      `rooms/${room}/latest`
    ),
    snapshot=>{

      const data =
        snapshot.val();

      if(
        !data ||
        !data.image ||
        !data.createdAt
      ){
        return;
      }

      if(
        data.createdAt
        <= lastStamp
      ){
        return;
      }

      lastStamp =
        data.createdAt;

      showPuppet(
        data.image
      );

    }
  );


  get(
    ref(
      db,
      `rooms/${room}/currentCountry`
    )
  )
  .then(snapshot=>{

    if(
      snapshot.exists() &&
      COUNTRIES[
        snapshot.val()
      ]
    ){

      showCountry(
        snapshot.val()
      );

    }

  });

}


/* 나라 실사 화면 */
function showCountry(country){

  const c =
    COUNTRIES[country];

  if(!c) return;


  document
  .getElementById("home")
  .classList.add("hidden");


  document
  .getElementById("world")
  .classList.remove("hidden");


  document
  .getElementById("photoBg")
  .style
  .backgroundImage =
    `url("${c.photo}")`;


  document
  .getElementById("countryTitle")
  .textContent =
    `${c.flag} ${c.name}`;


  document
  .getElementById("stage")
  .innerHTML = "";

}


/* QR */
function makeQR(){

  const box =
    document.getElementById("qr");

  box.innerHTML = "";


  const base =
    location.origin
    +
    location.pathname;


  const phoneURL =
    `${base}?mode=phone&room=${room}`;


  new QRCode(
    box,
    {
      text:phoneURL,
      width:140,
      height:140,
      correctLevel:
        QRCode.CorrectLevel.M
    }
  );

}


/* 캐릭터 걷기 */
function showPuppet(src){

  const stage =
    document.getElementById("stage");


  stage.innerHTML = "";


  const puppet =
    document.createElement("div");


  puppet.className =
    "puppet";


  [
    "body",
    "head",
    "armL",
    "armR",
    "legL",
    "legR"
  ]
  .forEach(part=>{

    const img =
      document.createElement("img");

    img.src =
      src;

    img.className =
      `piece ${part}`;

    puppet.appendChild(
      img
    );

  });


  stage.appendChild(
    puppet
  );


  const notice =
    document
    .getElementById(
      "arrive"
    );


  notice
  .classList
  .remove("show");


  void notice.offsetWidth;


  notice
  .classList
  .add("show");


  puppet
  .addEventListener(
    "animationend",
    ()=>{

      stage.innerHTML="";

    },
    {once:true}
  );

}


/* =========================
   휴대폰
========================= */

async function startPhone(){

  if(!room){

    document
    .getElementById("status")
    .textContent =
      "QR을 다시 찍어주세요.";

    return;

  }


  let finalImage =
    null;


  const input =
    document.getElementById(
      "photoInput"
    );


  const preview =
    document.getElementById(
      "preview"
    );


  const previewWrap =
    document.getElementById(
      "previewWrap"
    );


  const send =
    document.getElementById(
      "send"
    );


  const status =
    document.getElementById(
      "status"
    );


  const progress =
    document.getElementById(
      "progress"
    );


  const bar =
    document.getElementById(
      "bar"
    );


  onValue(
    ref(
      db,
      `rooms/${room}/currentCountry`
    ),
    snapshot=>{

      const key =
        snapshot.val();


      if(
        key &&
        COUNTRIES[key]
      ){

        const c =
          COUNTRIES[key];


        document
        .getElementById(
          "phoneCountry"
        )
        .textContent =
          `${c.flag} 지금 ${c.name} 여행 중이에요!`;

      }else{

        document
        .getElementById(
          "phoneCountry"
        )
        .textContent =
          "🌎 전자칠판에서 나라를 먼저 골라주세요.";

      }

    }
  );


  input
  .addEventListener(
    "change",
    async ()=>{

      const file =
        input.files?.[0];


      if(!file) return;


      send.disabled =
        true;


      previewWrap
      .style
      .display =
        "none";


      finalImage =
        null;


      progress
      .style
      .display =
        "block";


      bar.style.width =
        "8%";


      status.textContent =
        "✨ 캐릭터 자동 누끼를 준비하고 있어요...";


      try{

        const module =
          await import(
            "https://esm.sh/@imgly/background-removal@1.7.0"
          );


        const removeBackground =
          module.removeBackground
          ||
          module.default;


        const resultBlob =
          await removeBackground(
            file,
            {
              model:
                "isnet_quint8",

              device:
                "cpu",

              proxyToWorker:
                false,

              output:{
                format:
                  "image/png",

                quality:
                  1
              },

              progress:
              (
                key,
                current,
                total
              )=>{

                const percent =
                  Math.max(
                    10,
                    Math.min(
                      88,
                      Math.round(
                        current
                        /
                        total
                        *
                        88
                      )
                    )
                  );


                bar
                .style
                .width =
                  percent+"%";


                status
                .textContent =
                  `✂️ 배경을 자동으로 지우는 중... ${percent}%`;

              }

            }
          );


        bar.style.width =
          "92%";


        status.textContent =
          "✨ 캐릭터 모양을 다듬는 중...";


        finalImage =
          await resizeTransparent(
            resultBlob
          );


        bar.style.width =
          "100%";


        preview.src =
          finalImage;


        previewWrap
        .style
        .display =
          "block";


        send.disabled =
          false;


        status.textContent =
          "완성! 캐릭터만 남았어요 💛";


        setTimeout(
          ()=>{

            progress
            .style
            .display =
              "none";

          },
          500
        );

      }
      catch(error){

        console.error(error);


        status.textContent =
          "누끼 처리에 실패했어요. 흰 종이 위에서 다시 찍어주세요 🥹";


        progress
        .style
        .display =
          "none";

      }

    }
  );


  send
  .addEventListener(
    "click",
    async ()=>{

      if(
        !finalImage
      ){
        return;
      }


      send.disabled =
        true;


      status.textContent =
        "✈️ 전자칠판으로 날아가는 중...";


      const countrySnap =
        await get(
          ref(
            db,
            `rooms/${room}/currentCountry`
          )
        );


      const country =
        countrySnap.val()
        ||
        "world";


      await set(
        ref(
          db,
          `rooms/${room}/latest`
        ),
        {
          image:
            finalImage,

          country:
            country,

          createdAt:
            Date.now()
        }
      );


      status.textContent =
        "🎉 전자칠판에 도착했어요!";


      setTimeout(
        ()=>{

          finalImage =
            null;


          input.value =
            "";


          preview.src =
            "";


          previewWrap
          .style
          .display =
            "none";


          send.disabled =
            true;


          status.textContent =
            "다음 캐릭터도 찍어보세요 📸";

        },
        1700
      );

    }
  );

}


/* =========================
   투명 이미지 크기 줄이기
========================= */

async function resizeTransparent(blob){

  const img =
    await blobToImage(blob);


  const max =
    700;


  let width =
    img.naturalWidth;


  let height =
    img.naturalHeight;


  const scale =
    Math.min(
      1,
      max
      /
      Math.max(
        width,
        height
      )
    );


  width =
    Math.max(
      1,
      Math.round(
        width*scale
      )
    );


  height =
    Math.max(
      1,
      Math.round(
        height*scale
      )
    );


  const canvas =
    document
    .createElement(
      "canvas"
    );


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas
    .getContext(
      "2d"
    );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );


  const outputBlob =
    await new Promise(
      resolve=>
        canvas.toBlob(
          resolve,
          "image/webp",
          .82
        )
    );


  return await blobToDataURL(
    outputBlob
  );

}


function blobToImage(blob){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const url =
        URL.createObjectURL(
          blob
        );


      const img =
        new Image();


      img.onload =
        ()=>{

          URL
          .revokeObjectURL(
            url
          );

          resolve(
            img
          );

        };


      img.onerror =
        reject;


      img.src =
        url;

    }
  );

}


function blobToDataURL(blob){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const reader =
        new FileReader();


      reader.onload =
        ()=>resolve(
          reader.result
        );


      reader.onerror =
        reject;


      reader
      .readAsDataURL(
        blob
      );

    }
  );

}
