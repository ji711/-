<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🛂 5세 세계여행 출국심사</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:linear-gradient(145deg,#dff6ff,#f7edff);
  color:#18324a;
  min-height:100vh;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:#ffffffee;
  border-radius:30px;
  padding:22px;
  box-shadow:0 15px 50px #274b6b22;
}

.gate{
  background:#0d4772;
  color:white;
  border-radius:20px;
  padding:12px;
  text-align:center;
  font-weight:900;
  margin-bottom:15px;
}

h1{
  text-align:center;
  margin:0;
  font-size:30px;
}

.sub{
  text-align:center;
  color:#687d90;
  margin:7px 0 18px;
}

.step{
  text-align:center;
  font-weight:900;
  font-size:20px;
  margin:18px 0 12px;
}

/* 이름 카드 */

.names{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.nameCard{
  border:3px solid #d9e8f2;
  background:white;
  border-radius:22px;
  padding:18px 10px;
  font-size:22px;
  font-weight:1000;
  text-align:center;
  box-shadow:0 5px 15px #274b6b15;
  transition:.15s;
}

.nameCard:active{
  transform:scale(.96);
}

.nameCard.selected{
  border-color:#38a9df;
  background:#e9f9ff;
  box-shadow:0 0 0 4px #38a9df22;
}

.camera{
  position:relative;
  border-radius:24px;
  overflow:hidden;
  background:#071827;
  aspect-ratio:4/3;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:12px;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

.scan{
  position:absolute;
  width:62%;
  aspect-ratio:1/1;
  border:4px solid #54d6ff;
  border-radius:45%;
  box-shadow:0 0 0 999px #0004,0 0 30px #54d6ff;
  display:none;
}

.scan:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:20%;
  height:3px;
  background:#fff;
  box-shadow:0 0 15px #fff;
  animation:scan 1.5s infinite;
}

@keyframes scan{
  0%{top:15%}
  50%{top:80%}
  100%{top:15%}
}

.status{
  text-align:center;
  font-size:21px;
  font-weight:1000;
  margin:16px 0;
  min-height:30px;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:15px;
}

button{
  border:0;
  border-radius:16px;
  padding:14px 18px;
  font-size:17px;
  font-weight:900;
  background:#1679c7;
  color:white;
}

button.alt{
  background:#e9f1f7;
  color:#20577d;
}

/* 결과 */

.result{
  display:none;
  text-align:center;
  background:#eafaff;
  border:3px solid #bdeaff;
  border-radius:26px;
  padding:30px 20px;
  animation:pop .5s ease;
}

@keyframes pop{
  0%{transform:scale(.8);opacity:0}
  100%{transform:scale(1);opacity:1}
}

.pass{
  font-size:20px;
  font-weight:1000;
}

.resultName{
  font-size:44px;
  font-weight:1000;
  margin:10px 0;
}

.done{
  font-size:30px;
  font-weight:1000;
}

.travel{
  font-size:21px;
  margin-top:12px;
}

.plane{
  font-size:55px;
  animation:fly 2s ease-in-out infinite;
}

@keyframes fly{
  0%{transform:translateX(-20px)}
  50%{transform:translateX(20px)}
  100%{transform:translateX(-20px)}
}

/* 친구 관리 */

.panel{
  display:none;
  margin-top:18px;
  background:#f6f9fb;
  border-radius:20px;
  padding:18px;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.row input{
  flex:1;
  min-width:170px;
  border:1px solid #c9d7e2;
  border-radius:13px;
  padding:13px;
  font-size:16px;
}

.person{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:white;
  padding:10px 12px;
  border-radius:13px;
  margin-top:7px;
}

.small{
  font-size:13px;
  color:#6d7f90;
  line-height:1.5;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#17324a;
  color:white;
  padding:12px 16px;
  border-radius:99px;
  display:none;
  z-index:9;
}

/* 모바일 */

@media(max-width:500px){
  h1{font-size:26px}
  .nameCard{font-size:20px;padding:16px 8px}
  .done{font-size:26px}
  .resultName{font-size:38px}
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="gate">
🇰🇷 REPUBLIC OF KOREA · DEPARTURE CONTROL
</div>

<h1>🛂 5세 세계여행 출국심사</h1>

<div class="sub">
여행을 떠날 준비가 되었나요? ✈️🌎
</div>

<div id="chooseArea">

<div class="step">
🎫 나의 여권을 찾아주세요!
</div>

<div id="names" class="names"></div>

</div>

<div id="cameraArea" style="display:none">

<div class="step">
📷 얼굴을 보여주세요!
</div>

<div class="camera">

<video id="video" autoplay muted playsinline></video>

<div id="scan" class="scan"></div>

</div>

<div id="status" class="status">
카메라를 준비하고 있어요 🙂
</div>

</div>

<div id="result" class="result">

<div class="plane">✈️</div>

<div class="pass">
🎫 PASSENGER VERIFIED
</div>

<div id="resultName" class="resultName"></div>

<div class="done">
✅ 출국심사 완료!
</div>

<div class="travel">
즐거운 세계여행 되세요 🌎
</div>

</div>

<div class="buttons">

<button id="start" style="display:none">
📷 출국심사 시작
</button>

<button id="again" class="alt">
↻ 다음 친구
</button>

<button id="manage" class="alt">
👩‍🏫 친구 등록
</button>

</div>

<div id="panel" class="panel">

<h2>👩‍🏫 친구 이름 등록</h2>

<div class="small">
아이 이름을 등록하면 출국심사 화면에 큰 이름 카드로 나타나요.
</div>

<div class="row" style="margin-top:12px">

<input
id="personName"
placeholder="예: 소민이"
>

<button id="register">
친구 등록
</button>

</div>

<div id="people"></div>

<div class="small" style="margin-top:12px">
※ 교육용 출국심사 놀이입니다.
얼굴 사진이나 얼굴 특징값은 저장하지 않습니다.
</div>

</div>

</div>
</div>

<div id="toast" class="toast"></div>

<script>

let stream=null;
let selectedName="";
let running=false;
let timer=null;

const peopleKey="five_departure_names";

const $=id=>document.getElementById(id);

function people(){

  try{
    return JSON.parse(
      localStorage.getItem(peopleKey)||"[]"
    );
  }catch(e){
    return [];
  }

}

function savePeople(list){

  localStorage.setItem(
    peopleKey,
    JSON.stringify(list)
  );

  render();

}

function render(){

  const list=people();

  const names=$("names");
  const box=$("people");

  names.innerHTML="";
  box.innerHTML="";

  list.forEach(name=>{

    const card=document.createElement("button");

    card.className="nameCard";
    card.type="button";

    card.textContent="🎫 "+name;

    card.onclick=()=>selectName(name,card);

    names.appendChild(card);

    const person=document.createElement("div");

    person.className="person";

    const text=document.createElement("span");

    text.textContent="👤 "+name;

    const del=document.createElement("button");

    del.className="alt";
    del.textContent="삭제";

    del.onclick=()=>{

      savePeople(
        people().filter(x=>x!==name)
      );

    };

    person.appendChild(text);
    person.appendChild(del);

    box.appendChild(person);

  });

}

function selectName(name,card){

  selectedName=name;

  document.querySelectorAll(".nameCard")
    .forEach(x=>x.classList.remove("selected"));

  card.classList.add("selected");

  $("start").style.display="block";

  $("status").textContent=
    "🎫 "+name+" 친구의 여권이 선택되었어요!";

}

async function startCamera(){

  if(stream)return;

  if(!navigator.mediaDevices){

    throw new Error(
      "이 기기에서는 카메라를 사용할 수 없어요."
    );

  }

  stream=
    await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

  $("video").srcObject=stream;

}

function stopCamera(){

  if(stream){

    stream.getTracks().forEach(
      track=>track.stop()
    );

    stream=null;

  }

}

function finish(){

  running=false;

  clearTimeout(timer);

  $("scan").style.display="none";

  $("resultName").textContent=
    selectedName+" 출국심사";

  $("result").style.display="block";

  $("cameraArea").style.display="none";

  $("chooseArea").style.display="none";

  $("start").style.display="none";

  $("status").textContent=
    "🎉 출국심사가 완료되었습니다!";

  stopCamera();

}

$("start").onclick=async()=>{

  if(!selectedName){

    $("status").textContent=
      "🎫 먼저 친구 이름을 선택해주세요.";

    return;

  }

  try{

    $("chooseArea").style.display="none";

    $("cameraArea").style.display="block";

    $("result").style.display="none";

    $("start").style.display="none";

    $("status").textContent=
      "📷 카메라를 준비하고 있어요...";

    await startCamera();

    $("scan").style.display="block";

    $("status").textContent=
      "🙂 "+selectedName+" 친구, 얼굴을 보여주세요!";

    running=true;

    clearTimeout(timer);

    timer=setTimeout(()=>{

      if(running){
        $("status").textContent=
          "🔍 출국심사를 확인하고 있어요...";

        setTimeout(finish,1200);
      }

    },3000);

  }catch(e){

    $("status").textContent=
      "⚠️ 카메라 권한을 허용해주세요.";

    $("chooseArea").style.display="block";

  }

};

$("again").onclick=()=>{

  running=false;

  clearTimeout(timer);

  stopCamera();

  selectedName="";

  $("result").style.display="none";

  $("cameraArea").style.display="none";

  $("chooseArea").style.display="block";

  $("start").style.display="none";

  $("scan").style.display="none";

  $("status").textContent=
    "🎫 다음 친구의 여권을 찾아주세요!";

  document.querySelectorAll(".nameCard")
    .forEach(x=>x.classList.remove("selected"));

};

$("manage").onclick=()=>{

  const panel=$("panel");

  panel.style.display=
    panel.style.display==="none"
    ?"block"
    :"none";

  render();

};

$("register").onclick=()=>{

  const input=$("personName");

  const name=input.value.trim();

  if(!name){

    alert("친구 이름을 입력해주세요.");

    return;

  }

  const list=people();

  if(list.includes(name)){

    alert("이미 등록된 친구예요.");

    return;

  }

  list.push(name);

  savePeople(list);

  input.value="";

  show("✅ "+name+" 등록 완료!");

};

function show(text){

  const toast=$("toast");

  toast.textContent=text;

  toast.style.display="block";

  setTimeout(()=>{

    toast.style.display="none";

  },1800);

}

render();

</script>

</body>
</html>
