<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🛂 세계여행 출국심사</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:linear-gradient(145deg,#dff7ff,#fff1fa,#fff8df);
  color:#17324a;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.card{
  width:100%;
  max-width:850px;
  background:#ffffffee;
  border-radius:32px;
  padding:20px;
  box-shadow:0 15px 50px #274b6b22;
}

.gate{
  background:#0d4772;
  color:white;
  border-radius:18px;
  padding:11px;
  text-align:center;
  font-weight:900;
  margin-bottom:15px;
}

h1{
  text-align:center;
  margin:0;
  font-size:29px;
}

.sub{
  text-align:center;
  color:#687d90;
  margin:7px 0 15px;
}

/* 카메라 */

.camera{
  position:relative;
  overflow:hidden;
  border-radius:25px;
  background:#071827;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

.faceGuide{
  position:absolute;
  width:57%;
  height:72%;
  left:21.5%;
  top:14%;
  border:4px solid #58d7ff;
  border-radius:48%;
  box-shadow:
    0 0 0 999px #0004,
    0 0 30px #58d7ff;
}

.faceGuide:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  height:3px;
  top:15%;
  background:white;
  box-shadow:0 0 15px white;
  animation:scan 1.5s infinite;
}

@keyframes scan{
  0%{top:15%}
  50%{top:82%}
  100%{top:15%}
}

.status{
  text-align:center;
  font-size:21px;
  font-weight:1000;
  margin:15px 0;
  min-height:30px;
}

/* 완료 화면 */

.result{
  display:none;
  position:relative;
  overflow:hidden;
  min-height:570px;
  border-radius:30px;
  background:
    linear-gradient(
      180deg,
      #effcff 0%,
      #ffffff 55%,
      #fff5fb 100%
    );
  border:4px solid #bcecff;
  text-align:center;
  padding:25px 14px 30px;
  animation:resultIn .6s cubic-bezier(.2,1.5,.4,1);
}

@keyframes resultIn{
  0%{
    transform:scale(.65) rotate(-3deg);
    opacity:0;
  }
  70%{
    transform:scale(1.04) rotate(1deg);
  }
  100%{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

/* 위쪽 장식 */

.cloud{
  position:absolute;
  font-size:43px;
  opacity:.75;
  z-index:1;
}

.cloud1{
  top:38px;
  left:-70px;
  animation:cloud1 9s linear infinite;
}

.cloud2{
  top:145px;
  right:-75px;
  animation:cloud2 10s linear infinite;
}

@keyframes cloud1{
  from{left:-80px}
  to{left:110%}
}

@keyframes cloud2{
  from{right:-90px}
  to{right:110%}
}

.plane{
  position:absolute;
  top:82px;
  left:-100px;
  font-size:58px;
  z-index:2;
  animation:plane 3.2s .3s ease-in-out forwards;
}

@keyframes plane{
  0%{
    left:-100px;
    top:105px;
    transform:rotate(-5deg);
  }

  45%{
    left:45%;
    top:40px;
    transform:rotate(-5deg);
  }

  100%{
    left:110%;
    top:95px;
    transform:rotate(-5deg);
  }
}

/* 별 */

.star{
  position:absolute;
  z-index:1;
  font-size:28px;
  animation:twinkle 1.3s infinite alternate;
}

.star1{
  left:8%;
  top:125px;
}

.star2{
  right:8%;
  top:70px;
  animation-delay:.3s;
}

.star3{
  left:12%;
  bottom:125px;
  animation-delay:.6s;
}

.star4{
  right:11%;
  bottom:105px;
  animation-delay:.9s;
}

@keyframes twinkle{
  from{
    transform:scale(.65) rotate(0);
    opacity:.4;
  }
  to{
    transform:scale(1.2) rotate(18deg);
    opacity:1;
  }
}

/* 하트 */

.heart{
  position:absolute;
  z-index:1;
  font-size:24px;
  animation:heart 2.4s infinite ease-in-out;
}

.heart1{
  left:17%;
  top:205px;
}

.heart2{
  right:17%;
  top:260px;
  animation-delay:.8s;
}

@keyframes heart{
  0%,100%{
    transform:translateY(0) rotate(-8deg);
  }
  50%{
    transform:translateY(-16px) rotate(8deg);
  }
}

/* 빨간 여행 도장 */

.travelStamp{
  position:relative;
  z-index:4;

  width:235px;
  height:128px;

  margin:45px auto 24px;

  border:6px solid #d83c4d;
  color:#d83c4d;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  transform:rotate(-6deg) scale(0);
  opacity:0;

  font-family:Georgia,"Times New Roman",serif;
  font-weight:900;

  box-shadow:
    inset 0 0 0 3px #d83c4d,
    inset 0 0 18px #d83c4d44;

  animation:stamp .7s .25s cubic-bezier(.2,1.7,.3,1) forwards;
}

.travelStamp:before{
  content:"";
  position:absolute;
  inset:8px;
  border:2px dashed #d83c4d;
}

.stampTop{
  font-size:20px;
  letter-spacing:2px;
}

.stampMain{
  font-size:29px;
  letter-spacing:2px;
  margin:3px 0;
}

.stampBottom{
  font-size:15px;
  letter-spacing:1px;
}

@keyframes stamp{
  0%{
    transform:rotate(-6deg) scale(2.4);
    opacity:0;
  }

  55%{
    transform:rotate(-6deg) scale(.88);
    opacity:1;
  }

  75%{
    transform:rotate(-6deg) scale(1.08);
  }

  100%{
    transform:rotate(-6deg) scale(1);
    opacity:1;
  }
}

/* 완료 문구 */

.done{
  position:relative;
  z-index:5;
  font-size:33px;
  font-weight:1000;
  margin-top:5px;
  animation:textIn .7s .8s both;
}

.travelText{
  position:relative;
  z-index:5;
  margin-top:13px;
  font-size:20px;
  font-weight:800;
  line-height:1.7;
  animation:textIn .7s 1s both;
}

.worldText{
  position:relative;
  z-index:5;
  font-size:22px;
  font-weight:1000;
  margin-top:3px;
  animation:textIn .7s 1.1s both;
}

@keyframes textIn{
  0%{
    transform:translateY(18px);
    opacity:0;
  }
  100%{
    transform:translateY(0);
    opacity:1;
  }
}

/* 아래 장식 */

.bottomDecor{
  position:absolute;
  left:0;
  right:0;
  bottom:18px;
  display:flex;
  justify-content:center;
  gap:24px;
  font-size:34px;
  z-index:3;
  animation:bottomFloat 2.5s infinite ease-in-out;
}

@keyframes bottomFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-7px);
  }
}

.hidden{
  display:none!important;
}

.buttons{
  display:flex;
  justify-content:center;
  margin-top:15px;
}

button{
  border:0;
  border-radius:16px;
  padding:13px 21px;
  font-size:17px;
  font-weight:900;
  background:#1679c7;
  color:white;
}

@media(max-width:500px){

  .card{
    padding:17px;
  }

  h1{
    font-size:25px;
  }

  .result{
    min-height:540px;
  }

  .travelStamp{
    width:215px;
    height:118px;
    margin-top:42px;
  }

  .stampTop{
    font-size:18px;
  }

  .stampMain{
    font-size:26px;
  }

  .stampBottom{
    font-size:14px;
  }

  .done{
    font-size:29px;
  }

  .travelText{
    font-size:18px;
  }

  .worldText{
    font-size:20px;
  }

  .bottomDecor{
    font-size:30px;
    gap:18px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="gate">
🇰🇷 REPUBLIC OF KOREA · DEPARTURE CONTROL
</div>

<h1>🛂 세계여행 출국심사</h1>

<div class="sub">
여행을 떠날 준비가 되었나요? ✈️🌎
</div>

<div id="cameraArea">

<div class="camera">

<video id="video" autoplay muted playsinline></video>

<div class="faceGuide"></div>

</div>

<div id="status" class="status">
📷 얼굴을 화면 가운데에 보여주세요!
</div>

</div>


<!-- 출국심사 완료 -->

<div id="result" class="result">

<div class="cloud cloud1">☁️</div>
<div class="cloud cloud2">☁️</div>

<div class="plane">✈️</div>

<div class="star star1">⭐</div>
<div class="star star2">✨</div>
<div class="star star3">🌟</div>
<div class="star star4">⭐</div>

<div class="heart heart1">💕</div>
<div class="heart heart2">💖</div>


<div class="travelStamp">

<div class="stampTop">
DEPARTURE
</div>

<div class="stampMain">
APPROVED
</div>

<div class="stampBottom">
✈ TRAVEL
</div>

</div>


<div class="done">
🧳 출국심사 완료!
</div>

<div class="travelText">
여행을 떠날 준비가 되었습니다!
</div>

<div class="worldText">
🌎 즐거운 세계여행 되세요! ✈️
</div>


<div class="bottomDecor">
🧳　🌎　🎈　⭐　✈️
</div>

</div>


<div class="buttons">

<button id="again" class="hidden">
↻ 다음 친구
</button>

</div>

</div>
</div>


<!-- 얼굴 감지 라이브러리 -->

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>

let stream=null;
let finished=false;
let detecting=false;
let animationFrame=null;

const $=id=>document.getElementById(id);


/* 얼굴 감지 모델 */

async function loadFaceModels(){

  $("status").textContent=
    "🔍 출국심사 시스템을 준비하고 있어요...";

  try{

    await faceapi.nets.tinyFaceDetector.loadFromUri(
      "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
    );

    return true;

  }catch(error){

    console.error(error);

    $("status").textContent=
      "⚠️ 얼굴 확인 시스템을 불러오지 못했어요.";

    return false;

  }

}


/* 카메라 */

async function startCamera(){

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

      $("status").textContent=
        "⚠️ 이 브라우저에서는 카메라를 사용할 수 없어요.";

      return;

    }

    stream=
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:false

      });

    $("video").srcObject=stream;

    await $("video").play();

    $("status").textContent=
      "🙂 얼굴을 화면 가운데에 보여주세요!";

    detecting=true;

    detectFace();

  }catch(error){

    console.error(error);

    $("status").textContent=
      "⚠️ 카메라 사용을 허용해주세요.";

  }

}


/* 얼굴이 있는지 확인 */

async function detectFace(){

  if(!detecting || finished)return;

  const video=$("video");

  if(
    video.readyState >= 2 &&
    video.videoWidth > 0 &&
    video.videoHeight > 0
  ){

    try{

      const detection=
        await faceapi.detectSingleFace(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize:320,
            scoreThreshold:.5
          })
        );

      if(detection){

        $("status").textContent=
          "🔍 얼굴을 확인하고 있어요...";

        detecting=false;

        setTimeout(()=>{

          finish();

        },1000);

        return;

      }else{

        $("status").textContent=
          "🙂 얼굴을 화면 가운데에 보여주세요!";

      }

    }catch(error){

      console.error(error);

    }

  }

  animationFrame=
    requestAnimationFrame(detectFace);

}


/* 완료 */

function finish(){

  if(finished)return;

  finished=true;

  detecting=false;

  if(animationFrame){
    cancelAnimationFrame(animationFrame);
  }

  $("cameraArea")
    .classList
    .add("hidden");

  $("result").style.display="block";

  $("again")
    .classList
    .remove("hidden");

  stopCamera();

}


/* 카메라 종료 */

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    stream=null;

  }

}


/* 다음 친구 */

$("again").onclick=async()=>{

  finished=false;

  detecting=false;

  $("result").style.display="none";

  $("again")
    .classList
    .add("hidden");

  $("cameraArea")
    .classList
    .remove("hidden");

  $("status").textContent=
    "🔍 출국심사 시스템을 준비하고 있어요...";

  const ready=
    await loadFaceModels();

  if(ready){

    startCamera();

  }

};


/* 시작 */

window.addEventListener(
  "load",
  async()=>{

    const ready=
      await loadFaceModels();

    if(ready){

      startCamera();

    }

  }
);

</script>

</body>
</html>
