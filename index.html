<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>🛂 세계여행 출국심사</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:linear-gradient(145deg,#dff7ff,#fff1fa,#fff8df);
  color:#17324a;
  overflow:hidden;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.card{
  width:100%;
  max-width:850px;
  background:#ffffffee;
  border-radius:32px;
  padding:22px;
  box-shadow:0 15px 50px #274b6b22;
}

.gate{
  background:#0d4772;
  color:white;
  border-radius:20px;
  padding:12px;
  text-align:center;
  font-weight:900;
  margin-bottom:18px;
}

h1{
  text-align:center;
  margin:0;
  font-size:30px;
}

.sub{
  text-align:center;
  color:#687d90;
  margin:8px 0 18px;
}

.camera{
  position:relative;
  overflow:hidden;
  border-radius:26px;
  background:#071827;
  aspect-ratio:4/3;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

.face{
  position:absolute;
  width:58%;
  height:72%;
  border:4px solid #54d6ff;
  border-radius:48%;
  box-shadow:
    0 0 0 999px #0004,
    0 0 35px #54d6ff;
}

.face:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:15%;
  height:3px;
  background:white;
  box-shadow:0 0 15px white;
  animation:scan 1.5s infinite;
}

@keyframes scan{
  0%{top:15%}
  50%{top:82%}
  100%{top:15%}
}

.status{
  text-align:center;
  font-size:22px;
  font-weight:1000;
  margin:18px 0;
  min-height:32px;
}

/* =========================
   출국심사 완료 화면
   ========================= */

.result{
  display:none;
  position:relative;
  overflow:hidden;
  text-align:center;
  background:linear-gradient(180deg,#effcff,#fff7fd);
  border:4px solid #bcecff;
  border-radius:30px;
  padding:34px 15px 38px;
  min-height:500px;
  animation:resultIn .6s cubic-bezier(.2,1.5,.4,1);
}

@keyframes resultIn{
  0%{
    transform:scale(.65) rotate(-3deg);
    opacity:0;
  }
  70%{
    transform:scale(1.04) rotate(1deg);
  }
  100%{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

/* 빨간 여권 도장 */

.travelStamp{
  position:relative;
  z-index:3;
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  width:235px;
  height:125px;

  border:7px solid #d83c4d;
  color:#d83c4d;

  transform:rotate(-7deg) scale(0);
  opacity:0;

  margin:35px auto 28px;

  font-family:Georgia,"Times New Roman",serif;
  font-weight:900;

  letter-spacing:2px;

  box-shadow:
    inset 0 0 0 3px #d83c4d,
    inset 0 0 18px #d83c4d55;

  filter:url(#roughStamp);
  
  animation:stampBang .65s .25s cubic-bezier(.2,1.7,.3,1) forwards;
}

.travelStamp:before{
  content:"";
  position:absolute;
  inset:7px;
  border:2px dashed #d83c4d;
}

.travelStamp .top{
  font-size:21px;
  line-height:1.1;
}

.travelStamp .main{
  font-size:29px;
  line-height:1.05;
  margin:3px 0;
}

.travelStamp .bottom{
  font-size:16px;
  line-height:1;
}

@keyframes stampBang{
  0%{
    transform:rotate(-7deg) scale(2.3);
    opacity:0;
  }

  55%{
    transform:rotate(-7deg) scale(.88);
    opacity:1;
  }

  75%{
    transform:rotate(-7deg) scale(1.08);
  }

  100%{
    transform:rotate(-7deg) scale(1);
    opacity:1;
  }
}

/* 도장 주변 잉크 효과 */

.ink{
  position:absolute;
  z-index:2;
  color:#d83c4d;
  font-weight:900;
  opacity:0;
  animation:inkPop .5s .65s forwards;
}

.ink1{
  left:18%;
  top:145px;
  font-size:18px;
  transform:rotate(-15deg);
}

.ink2{
  right:17%;
  top:190px;
  font-size:15px;
  transform:rotate(12deg);
}

@keyframes inkPop{
  from{
    opacity:0;
    transform:scale(1.8) rotate(0);
  }
  to{
    opacity:.45;
  }
}

/* 멘트 */

.done{
  position:relative;
  z-index:4;
  font-size:34px;
  font-weight:1000;
  margin-top:5px;
  animation:textBounce .8s .8s both;
}

.travel{
  position:relative;
  z-index:4;
  margin-top:14px;
  font-size:21px;
  font-weight:800;
  line-height:1.7;
}

.world{
  position:relative;
  z-index:4;
  margin-top:2px;
  font-size:22px;
  font-weight:1000;
}

/* 비행기 */

.plane{
  position:absolute;
  z-index:1;
  left:-100px;
  top:105px;
  font-size:60px;
  animation:planeFly 3.2s .6s ease-in-out forwards;
}

@keyframes planeFly{
  0%{
    left:-100px;
    top:120px;
    transform:rotate(-5deg);
  }

  45%{
    left:45%;
    top:55px;
    transform:rotate(-5deg);
  }

  100%{
    left:110%;
    top:105px;
    transform:rotate(-5deg);
  }
}

/* 구름 */

.cloud{
  position:absolute;
  font-size:45px;
  opacity:.75;
  z-index:1;
}

.cloud1{
  left:-70px;
  top:65px;
  animation:cloudMove 8s linear infinite;
}

.cloud2{
  right:-80px;
  top:215px;
  animation:cloudMove2 9s linear infinite;
}

@keyframes cloudMove{
  from{left:-80px}
  to{left:110%}
}

@keyframes cloudMove2{
  from{right:-90px}
  to{right:110%}
}

/* 별 */

.star{
  position:absolute;
  font-size:30px;
  z-index:1;
  animation:twinkle 1.2s infinite alternate;
}

.s1{left:8%;top:160px}
.s2{right:9%;top:85px;animation-delay:.3s}
.s3{left:13%;bottom:80px;animation-delay:.6s}
.s4{right:14%;bottom:55px;animation-delay:.9s}

@keyframes twinkle{
  from{
    transform:scale(.7) rotate(0);
    opacity:.45;
  }
  to{
    transform:scale(1.25) rotate(20deg);
    opacity:1;
  }
}

/* 하트 */

.heart{
  position:absolute;
  font-size:25px;
  z-index:1;
  animation:heartFloat 2.5s infinite ease-in-out;
}

.h1{
  left:20%;
  top:40px;
}

.h2{
  right:20%;
  top:150px;
  animation-delay:.8s;
}

@keyframes heartFloat{
  0%,100%{
    transform:translateY(0) rotate(-8deg);
  }

  50%{
    transform:translateY(-18px) rotate(8deg);
  }
}

@keyframes textBounce{
  0%{
    transform:translateY(20px);
    opacity:0;
  }

  70%{
    transform:translateY(-5px);
  }

  100%{
    transform:translateY(0);
    opacity:1;
  }
}

/* 다시 하기 */

.buttons{
  display:flex;
  justify-content:center;
  margin-top:16px;
}

button{
  border:0;
  border-radius:16px;
  padding:14px 22px;
  font-size:17px;
  font-weight:900;
  background:#1679c7;
  color:white;
}

.hidden{
  display:none!important;
}

@media(max-width:500px){

  h1{
    font-size:26px;
  }

  .result{
    min-height:470px;
    padding-top:25px;
  }

  .travelStamp{
    width:215px;
    height:115px;
    margin-top:28px;
  }

  .travelStamp .top{
    font-size:18px;
  }

  .travelStamp .main{
    font-size:26px;
  }

  .travelStamp .bottom{
    font-size:14px;
  }

  .done{
    font-size:29px;
  }

  .travel{
    font-size:18px;
  }

  .world{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<div class="gate">
🇰🇷 REPUBLIC OF KOREA · DEPARTURE CONTROL
</div>

<h1>🛂 세계여행 출국심사</h1>

<div class="sub">
여행을 떠날 준비가 되었나요? ✈️🌎
</div>

<div id="cameraArea">

<div class="camera">

<video id="video" autoplay muted playsinline></video>

<div class="face"></div>

</div>

<div id="status" class="status">
📷 카메라를 준비하고 있어요...
</div>

</div>


<!-- 완료 화면 -->

<div id="result" class="result">

<div class="cloud cloud1">☁️</div>
<div class="cloud cloud2">☁️</div>

<div class="star s1">⭐</div>
<div class="star s2">✨</div>
<div class="star s3">🌟</div>
<div class="star s4">⭐</div>

<div class="heart h1">💕</div>
<div class="heart h2">💖</div>

<div class="plane">✈️</div>

<div class="ink ink1">✦</div>
<div class="ink ink2">✦</div>

<div class="travelStamp">

<div class="top">
DEPARTURE
</div>

<div class="main">
APPROVED
</div>

<div class="bottom">
✈ TRAVEL
</div>

</div>

<div class="done">
🧳 출국심사 완료!
</div>

<div class="travel">
여행을 떠날 준비가 되었습니다!
</div>

<div class="world">
🌎 즐거운 세계여행 되세요! ✈️
</div>

</div>


<div class="buttons">

<button id="again" class="hidden">
↻ 다음 친구
</button>

</div>

</div>
</div>


<script>

let stream=null;
let finished=false;
let timer=null;

const $=id=>document.getElementById(id);


/* 카메라 시작 */

async function startCamera(){

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

      $("status").textContent=
        "⚠️ 이 브라우저에서는 카메라를 사용할 수 없어요.";

      return;
    }

    stream=
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:false

      });

    $("video").srcObject=stream;

    $("status").textContent=
      "🙂 얼굴을 화면 가운데에 보여주세요!";


    /*
      교육용 출국심사 놀이입니다.

      얼굴의 신원을 식별하거나
      얼굴 정보를 저장하지 않습니다.

      카메라가 켜진 뒤 잠시 후
      출국심사 완료 화면이 나타납니다.
    */

    timer=
      setTimeout(()=>{

        finish();

      },3500);


  }catch(error){

    $("status").textContent=
      "⚠️ 카메라 사용을 허용해주세요.";

  }

}


/* 완료 화면 */

function finish(){

  if(finished)return;

  finished=true;

  if(timer){
    clearTimeout(timer);
  }

  $("cameraArea")
    .classList
    .add("hidden");

  $("result").style.display="block";

  $("again")
    .classList
    .remove("hidden");


  if(stream){

    stream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    stream=null;

  }

}


/* 다음 친구 */

$("again").onclick=()=>{

  finished=false;

  $("result").style.display="none";

  $("again")
    .classList
    .add("hidden");

  $("cameraArea")
    .classList
    .remove("hidden");

  $("status").textContent=
    "📷 다음 친구를 기다리고 있어요...";

  startCamera();

};


/* 페이지 열리면 카메라 시작 */

window.addEventListener(
  "load",
  startCamera
);

</script>

</body>
</html>
