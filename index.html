<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🛂 5세 세계여행 출국심사</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:linear-gradient(145deg,#dff5ff,#f5edff);
  color:#18324a;
  min-height:100vh
}
.wrap{max-width:900px;margin:auto;padding:18px}
.card{
  background:#fffffff2;
  border-radius:30px;
  padding:22px;
  box-shadow:0 15px 50px #274b6b22
}
h1{text-align:center;margin:0;font-size:30px}
.sub{text-align:center;color:#687d90;margin:7px 0 18px}
.gate{
  background:#0d4772;
  color:white;
  border-radius:20px;
  padding:12px;
  text-align:center;
  font-weight:800;
  margin-bottom:15px
}
.selectBox{
  background:#f6f9fb;
  border-radius:20px;
  padding:15px;
  margin-bottom:15px
}
select{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:1px solid #c9d7e2;
  border-radius:13px;
  font-size:17px;
  background:white
}
.camera{
  position:relative;
  border-radius:24px;
  overflow:hidden;
  background:#071827;
  aspect-ratio:4/3;
  display:flex;
  align-items:center;
  justify-content:center
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1)
}
.scan{
  position:absolute;
  width:62%;
  aspect-ratio:1/1;
  border:4px solid #54d6ff;
  border-radius:45%;
  box-shadow:0 0 0 999px #0004,0 0 30px #54d6ff;
  display:none
}
.scan:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:20%;
  height:3px;
  background:#fff;
  box-shadow:0 0 15px #fff;
  animation:scan 1.6s infinite
}
@keyframes scan{
  0%{top:15%}
  50%{top:80%}
  100%{top:15%}
}
.status{
  text-align:center;
  font-size:21px;
  font-weight:900;
  margin:16px 0;
  min-height:30px
}
.result{
  display:none;
  text-align:center;
  background:#eafaff;
  border:2px solid #bdeaff;
  border-radius:24px;
  padding:28px 20px
}
.pass{font-size:20px;font-weight:900}
.name{font-size:42px;font-weight:1000;margin:8px 0}
.done{font-size:28px;font-weight:900;margin:8px}
.travel{font-size:20px;margin-top:12px}
.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:14px
}
button{
  border:0;
  border-radius:15px;
  padding:13px 17px;
  font-size:16px;
  font-weight:800;
  background:#1679c7;
  color:#fff
}
button.alt{background:#e9f1f7;color:#20577d}
.panel{
  display:none;
  margin-top:18px;
  background:#f6f9fb;
  border-radius:20px;
  padding:18px
}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{
  flex:1;
  min-width:170px;
  border:1px solid #c9d7e2;
  border-radius:13px;
  padding:13px;
  font-size:16px
}
.person{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  padding:10px 12px;
  border-radius:13px;
  margin-top:7px
}
.small{font-size:13px;color:#6d7f90;line-height:1.5}
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#17324a;
  color:white;
  padding:12px 16px;
  border-radius:99px;
  display:none;
  z-index:9
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="gate">
🇰🇷 REPUBLIC OF KOREA · DEPARTURE CONTROL
</div>

<h1>🛂 5세 세계여행 출국심사</h1>

<div class="sub">
여행을 떠날 준비가 되었나요? ✈️🌎
</div>

<div class="selectBox">
<b>👤 출국하는 친구를 선택해주세요</b>
<select id="friendSelect">
<option value="">친구를 선택하세요</option>
</select>
</div>

<div class="camera">
<video id="video" autoplay muted playsinline></video>
<div id="scan" class="scan"></div>
</div>

<div id="status" class="status">
친구를 선택한 후 출국심사를 시작해주세요 🙂
</div>

<div id="result" class="result">
<div class="pass">🎫 PASSENGER VERIFIED</div>
<div id="resultName" class="name"></div>
<div class="done">✅ 출국심사 완료!</div>
<div class="travel">✈️ 즐거운 세계여행 되세요 🌎</div>
</div>

<div class="buttons">
<button id="start">📷 출국심사 시작</button>
<button id="again" class="alt">↻ 다음 친구</button>
<button id="manage" class="alt">👩‍🏫 친구 등록</button>
</div>

<div id="panel" class="panel">

<h2>👩‍🏫 친구 등록</h2>

<div class="small">
아이 이름을 등록하면 출국심사 화면에서 선택할 수 있어요.
</div>

<div class="row" style="margin-top:12px">
<input id="personName" placeholder="예: 소민이">
<button id="register">친구 등록</button>
</div>

<div id="people"></div>

<div class="small" style="margin-top:12px">
※ 교육용 출국심사 놀이입니다. 얼굴 사진이나 얼굴 특징값은 저장하지 않습니다.
</div>

</div>

</div>
</div>

<div id="toast" class="toast"></div>

<script>

let stream=null;
let timer=null;
let running=false;

const peopleKey="five_departure_names";

const $=id=>document.getElementById(id);

function people(){
  try{
    return JSON.parse(
      localStorage.getItem(peopleKey)||"[]"
    );
  }catch(e){
    return [];
  }
}

function savePeople(list){
  localStorage.setItem(
    peopleKey,
    JSON.stringify(list)
  );
  render();
}

function render(){

  const list=people();

  const box=$("people");
  const select=$("friendSelect");

  box.innerHTML="";
  select.innerHTML=
    '<option value="">친구를 선택하세요</option>';

  list.forEach(name=>{

    const option=document.createElement("option");

    option.value=name;
    option.textContent="👤 "+name;

    select.appendChild(option);

    const person=document.createElement("div");

    person.className="person";

    const text=document.createElement("span");

    text.textContent="👤 "+name;

    const del=document.createElement("button");

    del.className="alt";
    del.textContent="삭제";

    del.onclick=()=>{

      savePeople(
        people().filter(x=>x!==name)
      );

    };

    person.appendChild(text);
    person.appendChild(del);

    box.appendChild(person);

  });

}

async function startCamera(){

  if(stream)return;

  if(!navigator.mediaDevices){
    throw new Error("카메라를 사용할 수 없는 환경이에요.");
  }

  stream=await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:"user",
      width:{ideal:1280},
      height:{ideal:720}
    },
    audio:false
  });

  $("video").srcObject=stream;

}

function stopCamera(){

  if(stream){

    stream.getTracks().forEach(
      track=>track.stop()
    );

    stream=null;

  }

}

function finish(){

  running=false;

  clearTimeout(timer);

  $("scan").style.display="none";

  const name=$("friendSelect").value;

  $("resultName").textContent=name;

  $("result").style.display="block";

  $("status").textContent=
    "🎉 출국심사가 완료되었습니다!";

  stopCamera();

}

$("start").onclick=async()=>{

  const name=$("friendSelect").value;

  if(!name){

    $("status").textContent=
      "👤 먼저 친구를 선택해주세요.";

    return;

  }

  try{

    await startCamera();

    $("result").style.display="none";

    $("scan").style.display="block";

    $("status").textContent=
      "🙂 "+name+" 친구, 얼굴을 보여주세요!";

    running=true;

    clearTimeout(timer);

    timer=setTimeout(()=>{

      if(running){
        finish();
      }

    },3000);

  }catch(e){

    $("status").textContent=
      "⚠️ 카메라 권한을 허용해주세요.";

  }

};

$("again").onclick=()=>{

  running=false;

  clearTimeout(timer);

  $("result").style.display="none";
  $("scan").style.display="none";

  stopCamera();

  $("friendSelect").value="";

  $("status").textContent=
    "👤 다음 친구를 선택해주세요.";

};

$("manage").onclick=()=>{

  const panel=$("panel");

  panel.style.display=
    panel.style.display==="none"
    ?"block"
    :"none";

  render();

};

$("register").onclick=()=>{

  const input=$("personName");

  const name=input.value.trim();

  if(!name){

    alert("친구 이름을 입력해주세요.");

    return;

  }

  const list=people();

  if(!list.includes(name)){

    list.push(name);

    savePeople(list);

    show("✅ "+name+" 등록 완료!");

  }else{

    alert("이미 등록된 친구예요.");

  }

  input.value="";

};

function show(text){

  const toast=$("toast");

  toast.textContent=text;

  toast.style.display="block";

  setTimeout(()=>{
    toast.style.display="none";
  },1800);

}

render();

</script>

</body>
</html>
