<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🛂 5세 세계여행 출국심사</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:linear-gradient(145deg,#dff7ff,#fff1fa,#fff8df);
  color:#17324a;
  overflow-x:hidden;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.card{
  width:100%;
  max-width:850px;
  background:#ffffffee;
  border-radius:32px;
  padding:22px;
  box-shadow:0 15px 50px #274b6b22;
}

.gate{
  background:#0d4772;
  color:white;
  border-radius:20px;
  padding:12px;
  text-align:center;
  font-weight:900;
  margin-bottom:18px;
}

h1{
  text-align:center;
  margin:0;
  font-size:30px;
}

.sub{
  text-align:center;
  color:#687d90;
  margin:8px 0 18px;
}

.camera{
  position:relative;
  overflow:hidden;
  border-radius:26px;
  background:#071827;
  aspect-ratio:4/3;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

.face{
  position:absolute;
  width:58%;
  height:72%;
  border:4px solid #54d6ff;
  border-radius:48%;
  box-shadow:0 0 0 999px #0004,0 0 35px #54d6ff;
}

.face:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:15%;
  height:3px;
  background:white;
  box-shadow:0 0 15px white;
  animation:scan 1.5s infinite;
}

@keyframes scan{
  0%{top:15%}
  50%{top:82%}
  100%{top:15%}
}

.status{
  text-align:center;
  font-size:22px;
  font-weight:1000;
  margin:18px 0;
  min-height:32px;
}

/* 완료 화면 */

.result{
  display:none;
  position:relative;
  overflow:hidden;
  text-align:center;
  background:linear-gradient(180deg,#effcff,#fff7fd);
  border:4px solid #bcecff;
  border-radius:30px;
  padding:28px 15px 34px;
  min-height:480px;
  animation:resultIn .6s cubic-bezier(.2,1.5,.4,1);
}

@keyframes resultIn{
  0%{
    transform:scale(.65) rotate(-3deg);
    opacity:0;
  }
  70%{
    transform:scale(1.05) rotate(1deg);
  }
  100%{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

.cheer{
  font-size:25px;
  font-weight:1000;
  animation:cheer .8s ease-out;
}

@keyframes cheer{
  0%{transform:scale(0)}
  70%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

.bigCheck{
  width:105px;
  height:105px;
  margin:15px auto 8px;
  border-radius:50%;
  background:#65d7a2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  box-shadow:0 8px 0 #37ad78;
  animation:checkPop .9s cubic-bezier(.2,1.6,.4,1);
}

@keyframes checkPop{
  0%{
    transform:scale(0) rotate(-30deg);
  }
  60%{
    transform:scale(1.2) rotate(8deg);
  }
  100%{
    transform:scale(1) rotate(0);
  }
}

.pass{
  display:inline-block;
  margin-top:15px;
  padding:8px 20px;
  border:4px solid #e66b76;
  border-radius:50%;
  color:#df5360;
  font-size:22px;
  font-weight:1000;
  transform:rotate(-7deg) scale(0);
  animation:stamp .5s 1s forwards;
}

@keyframes stamp{
  0%{
    transform:rotate(-7deg) scale(2);
    opacity:0;
  }
  70%{
    transform:rotate(-7deg) scale(.9);
  }
  100%{
    transform:rotate(-7deg) scale(1);
    opacity:1;
  }
}

.done{
  margin-top:10px;
  font-size:34px;
  font-weight:1000;
  animation:textBounce .8s 1.1s both;
}

@keyframes textBounce{
  0%{transform:translateY(20px);opacity:0}
  70%{transform:translateY(-5px)}
  100%{transform:translateY(0);opacity:1}
}

.travel{
  margin-top:13px;
  font-size:21px;
  font-weight:800;
}

.plane{
  position:absolute;
  left:-100px;
  top:115px;
  font-size:60px;
  animation:planeFly 2.8s 1.1s ease-in-out forwards;
}

@keyframes planeFly{
  0%{
    left:-100px;
    top:120px;
    transform:rotate(-5deg);
  }
  45%{
    left:45%;
    top:55px;
    transform:rotate(-5deg);
  }
  100%{
    left:110%;
    top:110px;
    transform:rotate(-5deg);
  }
}

.cloud{
  position:absolute;
  font-size:45px;
  opacity:.75;
}

.cloud1{
  left:-60px;
  top:65px;
  animation:cloudMove 7s linear infinite;
}

.cloud2{
  right:-70px;
  top:200px;
  animation:cloudMove2 8s linear infinite;
}

@keyframes cloudMove{
  from{left:-70px}
  to{left:110%}
}

@keyframes cloudMove2{
  from{right:-80px}
  to{right:110%}
}

.star{
  position:absolute;
  font-size:30px;
  animation:twinkle 1.2s infinite alternate;
}

.s1{left:8%;top:150px}
.s2{right:9%;top:90px;animation-delay:.3s}
.s3{left:13%;bottom:80px;animation-delay:.6s}
.s4{right:14%;bottom:55px;animation-delay:.9s}

@keyframes twinkle{
  from{
    transform:scale(.7) rotate(0);
    opacity:.45;
  }
  to{
    transform:scale(1.25) rotate(20deg);
    opacity:1;
  }
}

.heart{
  position:absolute;
  font-size:25px;
  animation:heartFloat 2.5s infinite ease-in-out;
}

.h1{left:20%;top:40px}
.h2{right:20%;top:150px;animation-delay:.8s}

@keyframes heartFloat{
  0%,100%{transform:translateY(0) rotate(-8deg)}
  50%{transform:translateY(-18px) rotate(8deg)}
}

.bottomMessage{
  margin-top:16px;
  font-size:18px;
  font-weight:900;
}

.hidden{
  display:none!important;
}

.buttons{
  display:flex;
  justify-content:center;
  margin-top:16px;
}

button{
  border:0;
  border-radius:16px;
  padding:14px 22px;
  font-size:17px;
  font-weight:900;
  background:#1679c7;
  color:white;
}

@media(max-width:500px){
  h1{font-size:26px}
  .result{min-height:450px}
  .done{font-size:29px}
  .travel{font-size:19px}
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="gate">
🇰🇷 REPUBLIC OF KOREA · DEPARTURE CONTROL
</div>

<h1>🛂 세계여행 출국심사</h1>

<div class="sub">
여행을 떠날 준비가 되었나요? ✈️🌎
</div>

<div id="cameraArea">

<div class="camera">
<video id="video" autoplay muted playsinline></video>
<div class="face"></div>
</div>

<div id="status" class="status">
📷 카메라를 준비하고 있어요...
</div>

</div>

<div id="result" class="result">

<div class="cloud cloud1">☁️</div>
<div class="cloud cloud2">☁️</div>

<div class="star s1">⭐</div>
<div class="star s2">✨</div>
<div class="star s3">🌟</div>
<div class="star s4">⭐</div>

<div class="heart h1">💕</div>
<div class="heart h2">💖</div>

<div class="plane">✈️</div>

<div class="cheer">
🌈✨ 짝짝짝! ✨🌈
</div>

<div class="bigCheck">
✓
</div>

<div class="pass">
🎫 PASS!
</div>

<div class="done">
🎉 출국심사 완료! 🎉
</div>

<div class="travel">
✈️💨 비행기가 슝~ 날아가요!
</div>

<div class="bottomMessage">
🌎 즐거운 세계여행을 다녀오세요! 🌎
<br>
🧳🎈 행복한 여행 되세요! 🎈🧳
</div>

</div>

<div class="buttons">

<button id="again" class="hidden">
↻ 다음 친구
</button>

</div>

</div>
</div>

<script>

let stream=null;
let finished=false;
let timer=null;

const $=id=>document.getElementById(id);

async function startCamera(){

  try{

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

      $("status").textContent=
        "⚠️ 이 브라우저에서는 카메라를 사용할 수 없어요.";

      return;
    }

    stream=await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:false

    });

    $("video").srcObject=stream;

    $("status").textContent=
      "🙂 얼굴을 화면 가운데에 보여주세요!";

    timer=setTimeout(()=>{

      finish();

    },3500);

  }catch(error){

    $("status").textContent=
      "⚠️ 카메라 사용을 허용해주세요.";

  }

}

function finish(){

  if(finished)return;

  finished=true;

  if(timer){
    clearTimeout(timer);
  }

  $("cameraArea").classList.add("hidden");

  $("result").style.display="block";

  $("again").classList.remove("hidden");

  if(stream){

    stream.getTracks().forEach(
      track=>track.stop()
    );

    stream=null;

  }

}

$("again").onclick=()=>{

  finished=false;

  $("result").style.display="none";

  $("again").classList.add("hidden");

  $("cameraArea").classList.remove("hidden");

  $("status").textContent=
    "📷 다음 친구를 기다리고 있어요...";

  startCamera();

};

window.addEventListener(
  "load",
  startCamera
);

</script>

</body>
</html>
