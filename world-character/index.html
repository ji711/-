<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터와 떠나는 세계여행</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer}

/* 시작 */
.screen{
  width:100vw;
  height:100vh;
}
#start{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(#aee7ff,#f7fdff);
}
#start .earth{font-size:90px}
#start h1{
  font-size:clamp(38px,7vw,80px);
  margin:10px 20px;
}
#start p{
  font-size:clamp(19px,3vw,30px);
  line-height:1.6;
}
.bigButton{
  border:0;
  background:white;
  padding:18px 35px;
  border-radius:40px;
  font-size:clamp(20px,3vw,30px);
  font-weight:bold;
  box-shadow:0 7px 20px #0002;
}

/* 나라 선택 */
#countries{
  display:none;
  background:#eef9ff;
  text-align:center;
  padding:25px;
  overflow:auto;
}
#countries h2{
  font-size:clamp(32px,5vw,60px);
  margin:15px;
}
.countryGrid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  max-width:900px;
  margin:30px auto;
}
.country{
  width:170px;
  min-height:120px;
  border:0;
  border-radius:25px;
  background:white;
  box-shadow:0 6px 16px #0002;
  font-size:22px;
  font-weight:bold;
}
.country span{
  display:block;
  font-size:50px;
}

/* 이집트 */
#egypt{
  display:none;
  position:relative;
  overflow:hidden;
  background:linear-gradient(
    #69d2ff 0%,
    #c7efff 52%,
    #f6ce75 53%,
    #e7a746 100%
  );
}
.sun{
  position:absolute;
  width:110px;
  height:110px;
  border-radius:50%;
  background:#ffd84b;
  right:8%;
  top:9%;
  box-shadow:0 0 40px #ffd84b;
}
.pyramidBack{
  position:absolute;
  bottom:18%;
  left:8%;
  border-left:180px solid transparent;
  border-right:180px solid transparent;
  border-bottom:260px solid #d99c42;
}
.pyramid{
  position:absolute;
  bottom:13%;
  left:38%;
  border-left:280px solid transparent;
  border-right:280px solid transparent;
  border-bottom:400px solid #e6b354;
  filter:drop-shadow(14px 10px 4px #8f5c2744);
}
.dune{
  position:absolute;
  width:75%;
  height:190px;
  border-radius:50%;
  background:#efb957;
  bottom:-100px;
  left:-10%;
}
.dune2{
  left:auto;
  right:-20%;
  background:#dfa345;
}

.title{
  position:absolute;
  z-index:20;
  top:4%;
  left:4%;
  color:white;
  text-shadow:0 3px 8px #0005;
}
.title strong{
  display:block;
  font-size:clamp(35px,5vw,65px);
}
.title span{
  font-size:clamp(17px,2vw,26px);
}

/* 캐릭터가 나타나는 공간 */
#characterWorld{
  position:absolute;
  inset:0;
  z-index:15;
  pointer-events:none;
}

.traveler{
  position:absolute;
  bottom:7%;
  left:-180px;
  width:clamp(100px,14vw,190px);
  height:clamp(120px,18vw,230px);
  object-fit:contain;
  filter:drop-shadow(0 8px 5px #0003);
  animation:travel 15s linear infinite;
}

@keyframes travel{
  0%{
    left:-20%;
    bottom:7%;
    transform:rotate(-4deg) translateY(0);
  }
  12%{
    transform:rotate(4deg) translateY(-15px);
  }
  25%{
    left:20%;
    bottom:7%;
    transform:rotate(-4deg);
  }
  42%{
    left:38%;
    bottom:19%;
    transform:rotate(4deg) translateY(-12px);
  }
  58%{
    left:51%;
    bottom:34%;
    transform:rotate(-4deg);
  }
  73%{
    left:63%;
    bottom:18%;
    transform:rotate(4deg) translateY(-12px);
  }
  100%{
    left:110%;
    bottom:7%;
    transform:rotate(-4deg);
  }
}

/* 버튼 */
.back{
  position:absolute;
  z-index:50;
  top:20px;
  right:20px;
  border:0;
  border-radius:30px;
  padding:12px 20px;
  background:#ffffffdd;
  font-size:18px;
  font-weight:bold;
}
.upload{
  position:absolute;
  z-index:60;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
}
.upload label{
  display:block;
  background:white;
  padding:15px 25px;
  border-radius:35px;
  box-shadow:0 6px 20px #0003;
  font-size:20px;
  font-weight:bold;
}
.upload input{display:none}

#message{
  position:absolute;
  z-index:80;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#ffffffee;
  padding:10px 20px;
  border-radius:25px;
  font-weight:bold;
  display:none;
  white-space:nowrap;
}
</style>
</head>

<body>

<section id="start" class="screen">
  <div class="earth">🌎✈️</div>
  <h1>캐릭터와 떠나는 세계여행</h1>
  <p>
    내가 그린 캐릭터가 살아 움직여요!<br>
    어디로 여행을 떠나볼까요?
  </p>
  <button class="bigButton" onclick="showCountries()">
    여행 시작하기 ✈️
  </button>
</section>

<section id="countries" class="screen">
  <h2>🌎 어디로 떠나볼까요?</h2>
  <p>가고 싶은 나라를 선택해 주세요!</p>

  <div class="countryGrid">
    <button class="country" onclick="showEgypt()">
      <span>🇪🇬</span>이집트
    </button>

    <button class="country" onclick="comingSoon()">
      <span>🇫🇷</span>프랑스
    </button>

    <button class="country" onclick="comingSoon()">
      <span>🇯🇵</span>일본
    </button>

    <button class="country" onclick="comingSoon()">
      <span>🇬🇧</span>영국
    </button>

    <button class="country" onclick="comingSoon()">
      <span>🇺🇸</span>미국
    </button>

    <button class="country" onclick="comingSoon()">
      <span>🇨🇳</span>중국
    </button>

    <button class="country" onclick="comingSoon()">
      <span>🇻🇳</span>베트남
    </button>

    <button class="country" onclick="comingSoon()">
      <span>🇧🇷</span>브라질
    </button>
  </div>
</section>

<section id="egypt" class="screen">

  <div class="sun"></div>
  <div class="pyramidBack"></div>
  <div class="pyramid"></div>
  <div class="dune"></div>
  <div class="dune dune2"></div>

  <div class="title">
    <strong>🇪🇬 이집트</strong>
    <span>내 캐릭터와 피라미드 여행!</span>
  </div>

  <div id="characterWorld"></div>

  <button class="back" onclick="showCountries()">
    🌎 다른 나라
  </button>

  <div id="message"></div>

  <div class="upload">
    <label>
      📸 내 캐릭터 보내기
      <input
        id="photo"
        type="file"
        accept="image/*"
        capture="environment"
      >
    </label>
  </div>

</section>

<script>
function hideScreens(){
  document.getElementById("start").style.display="none";
  document.getElementById("countries").style.display="none";
  document.getElementById("egypt").style.display="none";
}

function showCountries(){
  hideScreens();
  document.getElementById("countries").style.display="block";
}

function showEgypt(){
  hideScreens();
  document.getElementById("egypt").style.display="block";
}

function comingSoon(){
  alert("이 나라는 다음에 여행을 떠나요! 🌎✨");
}

function say(text){
  const box=document.getElementById("message");
  box.textContent=text;
  box.style.display="block";
  setTimeout(()=>box.style.display="none",2500);
}
</script>


<!-- Firebase -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyCBdA2qEuytaJQwGil8Smo1mBtUPrVivAM",
  authDomain: "world-character.firebaseapp.com",
  databaseURL: "https://world-character-default-rtdb.firebaseio.com",
  projectId: "world-character",
  storageBucket: "world-character.firebasestorage.app",
  messagingSenderId: "462004318277",
  appId: "1:462004318277:web:3e7a7237d5bfea6b76332c",
  measurementId: "G-W2E6LTWTCJ"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const photo=document.getElementById("photo");


/* 사진 선택 */
photo.addEventListener("change",async function(){

  const file=this.files[0];
  if(!file) return;

  say("✨ 캐릭터를 준비하고 있어요!");

  try{

    const image=await loadImage(file);

    const canvas=document.createElement("canvas");

    /* Firebase에 너무 큰 사진이 들어가지 않도록 축소 */
    const MAX=500;
    let w=image.width;
    let h=image.height;

    if(w>h && w>MAX){
      h=h*(MAX/w);
      w=MAX;
    }
    else if(h>MAX){
      w=w*(MAX/h);
      h=MAX;
    }

    canvas.width=Math.round(w);
    canvas.height=Math.round(h);

    const ctx=canvas.getContext("2d");

    ctx.drawImage(image,0,0,canvas.width,canvas.height);

    /*
      흰 종이 배경을 최대한 투명하게 만들기
    */
    const data=ctx.getImageData(
      0,0,canvas.width,canvas.height
    );

    const pixels=data.data;

    for(let i=0;i<pixels.length;i+=4){

      const r=pixels[i];
      const g=pixels[i+1];
      const b=pixels[i+2];

      const brightness=(r+g+b)/3;

      if(
        brightness>235 &&
        Math.abs(r-g)<18 &&
        Math.abs(g-b)<18
      ){
        pixels[i+3]=0;
      }

      else if(brightness>215){
        pixels[i+3]=Math.max(
          0,
          255-(brightness-215)*6
        );
      }
    }

    ctx.putImageData(data,0,0);

    const imageData=
      canvas.toDataURL("image/png");

    await push(
      ref(db,"characters"),
      {
        image:imageData,
        country:"egypt",
        created:Date.now()
      }
    );

    say("🌟 캐릭터가 여행을 떠났어요!");

  }
  catch(error){
    console.error(error);
    say("🥹 다시 한 번 찍어주세요!");
  }

  this.value="";
});


function loadImage(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=function(e){

      const img=new Image();

      img.onload=()=>resolve(img);
      img.onerror=reject;

      img.src=e.target.result;
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });
}


/*
 전자칠판에서도 같은 페이지를 켜두면
 새 그림이 들어오는 순간 자동 등장
*/
const characterRef=ref(db,"characters");

onChildAdded(characterRef,(snapshot)=>{

  const character=snapshot.val();

  if(
    !character ||
    !character.image ||
    character.country!=="egypt"
  ) return;

  addCharacter(character.image);

});


function addCharacter(src){

  const world=
    document.getElementById("characterWorld");

  const img=document.createElement("img");

  img.src=src;
  img.className="traveler";

  /* 여러 아이가 겹치지 않도록 조금씩 다르게 */
  const delay=Math.random()*5;

  img.style.animationDelay=
    "-" + delay + "s";

  img.style.width=
    (110+Math.random()*70)+"px";

  world.appendChild(img);

}

</script>

</body>
</html>
